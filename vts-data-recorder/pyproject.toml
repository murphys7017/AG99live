[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ag99-vts-recorder"
version = "0.2.0"
description = "Independent VTube Studio parameter recorder for AG99live"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=15,<16",
]

[project.optional-dependencies]
recording = [
  "numpy>=1.24",
  "sounddevice>=0.5",
]
stt = [
  "numpy>=1.24",
  "sherpa-onnx>=1.10",
  "sherpa-onnx-bin>=1.10",
]
live = [
  "numpy>=1.24",
  "sounddevice>=0.5",
  "sherpa-onnx>=1.10",
  "sherpa-onnx-bin>=1.10",
]

[project.scripts]
ag99-vts-recorder = "ag99_vts_recorder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
