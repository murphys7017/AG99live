[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ag99-vts-recorder"
version = "0.2.0"
description = "Independent VTube Studio parameter recorder for AG99live"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=15,<16",
]

[project.scripts]
ag99-vts-recorder = "ag99_vts_recorder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
