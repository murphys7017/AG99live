name: workflow
version: 0.1.0
purpose: Define baseline workflow constraints.
rules:
  - id: inspect_before_editing
    severity: high
    category: context_control
    description: Build context before modifying files.
    applies_to:
      - file_modification
      - behavior_affecting_change
      - repository_maintenance
    enforcement: require_context_review
    exceptions:
      - trivial_direct_user_instruction

  - id: smallest_correct_change
    severity: high
    category: scope_control
    description: Prefer the smallest correct change that solves the task.
    applies_to:
      - implementation
      - bugfix
      - refactor
      - documentation
    enforcement: minimize_scope
    exceptions:
      - user_explicitly_requests_redesign

  - id: review_before_completion
    severity: medium
    category: feedback_control
    description: Check changed files and repository status before declaring completion.
    applies_to:
      - file_modification
      - git_operation
      - medium_risk_task
      - high_risk_task
    enforcement: require_final_review
    exceptions:
      - read_only_task
