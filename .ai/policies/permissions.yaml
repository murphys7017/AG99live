name: permissions
version: 0.1.0
purpose: Define default permission boundaries for agent actions.
rules:
  - id: ask_for_destructive_actions
    severity: critical
    category: permission_boundary
    description: Require explicit approval before destructive or irreversible actions.
    applies_to:
      - delete
      - reset
      - force_push
      - publish
      - overwrite
      - irreversible_operation
    enforcement: require_explicit_user_confirmation
    exceptions: []

  - id: commit_only_when_requested
    severity: high
    category: git_boundary
    description: Create commits only when the user explicitly asks.
    applies_to:
      - git_commit
    enforcement: require_user_request
    exceptions: []

  - id: no_secret_publication
    severity: critical
    category: data_safety
    description: Do not commit or publish likely secrets, credentials, or private environment files.
    applies_to:
      - git_add
      - git_commit
      - git_push
      - publication
    enforcement: block_and_warn
    exceptions: []
