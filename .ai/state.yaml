  assumptions:
    - The adapter owns the computer key to codex-cli-app-server endpoint mapping.
    - Only configured and online remote operator computers are exposed in prompt context.
    - AstrBot model output for remote operation remains exactly `computer` plus `prompt`.
    - Remote execution results are re-entered as system-level text input through the existing AstrBot event path.
