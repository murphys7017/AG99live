    - "Do not restyle the desktop Electron windows; the control page theme layer is scoped to the plugin page only."
    - "Do not migrate web_control.py to astrbot.api.web; the installed SDK does not expose it."
    - "Do not choose the control page visual theme; it is pending separate user direction."
  findings:
    - "The running AstrBot supports views/<page>/index.html, relative bridge endpoints, and register_web_api routes prefixed by the plugin name."
    - "The installed SDK does not expose astrbot.api.web; the implementation uses its Quart-compatible request context and g.username."
    - "The installed AstrBot is 4.28.1. Its astrbot/api/ has no web module, so the documented astrbot.api.web migration would break this plugin until the host is upgraded."
    - "AstrBot 4.28.1 parent and bridge match the current master contract: status==error is rejected, data is unwrapped with data ?? response, and the bridge exposes onContext, t and upload/download/SSE."
    - "PlatformManager does not call terminate() when run() exits with an exception, so the control-platform registry is also cleared in run()'s finally block."
    - "The control page was unscrollable because it imported the former src/style.css, whose Electron window-shell reset pins html/body/#app to height:100% + overflow:hidden and clips overflowing content; the page only overrode body, never #app. Verified: scroll reported moved:false/atEnd:true while later config groups and the save button were unreachable."
    - "src/style.css mixed two ownership concerns: the Electron desktop chrome and the components shared with the plugin page. It is now split into styles/desktop-app.css, styles/shared-components.css and styles/desktop-windows.css; the desktop imports all three in the original cascade order and the control page imports only the shared one."
    - "Three shared-component rules (settings-card header/eyebrow/h2, history-item header) were defined inside the desktop block and were relocated to styles/shared-components.css."
    - "styles/shared-components.css depends on the --ink-* tokens declared by the desktop block, so web-control/theme.css redefines them for the dark control surface."
    - "The host is Vue 3 + Vuetify 3 with a blue primary (light #3c96ca, dark #5ba4d4) and light/dark/system modes. It syncs theme to a plugin page three ways: a ?theme= query param, bridge context isDark, and <html data-theme>; the control page currently ignores all three, so a light-mode host renders a dark island. Theme work is deliberately deferred."
    - "Plugin config (self._plugin.config + save_config) and platform config (AstrBot PlatformManager-owned platform_config) are separate persistence owners; unifying them in the page is not yet possible without AstrBot-side platform config persistence."
    - "The plugin config shape was previously declared three times: _conf_schema.json, the web_control validator, and the Vue template. web_control.CONFIG_SCHEMA is now the single source for validation, defaults and the served form metadata."
    - "The bridge reduces a rejected API call to a bare message string and drops any field pointer, so save_settings reports a rejected patch as HTTP 200 with {ok:false, error:{code, field}} instead of using the error channel."
    - "A machine-local setting does not have to be controlled locally: the desktop is already connected to the adapter over a single-client WebSocket, so the adapter can broker page request -> client answer. The adapter owns no such value and only caches the last answer for the offline view."
    - "Desktop settings use one uniform shape for every key: {value, options:[{id,label}]}. list returns the current value plus the options the client actually has; set applies the page's choice. No capture mode is needed, because a keyboard key is already an enumerable DOM code in DOM_CODE_TO_UIOHOOK_KEYCODE and a microphone is an enumerable device list."
    - "The broker is keyed by request_id, has an 8s timeout, and releases waiters on disconnect and on terminate so a dropped client cannot hang the page."
    - "The desktop rejects a set value that is not in the option list it just reported, so a stale page cannot push an arbitrary device id into the capture runtime."
    - "The page shows the last known desktop value with its report time and an explicit not-connected/not-editable note while the client is offline, rather than showing an empty or invented value."
  validation:
    - "npm run build:astrbot-page passed and generated astrbot_plugin_ag99live_adapter/views/control-panel."
    - "Adapter run() now unregisters its control-platform entry on every exit; terminate() cleanup remains identity-checked."
    - "AstrBot venv smoke check passed for valid/invalid settings, module syntax, and all eight registered plugin routes."
    - "AstrBot plugin structure checker reported 0 errors and 0 warnings."
    - "git diff --check passed."
    - "Full compileall could not write existing __pycache__ files while the AstrBot runtime was active; the changed module passed in-memory syntax compilation."
    - "vue-tsc typecheck:renderer passed after the stylesheet split and after the schema-driven form."
    - "Desktop rendering parity was proven mechanically: the pre-change and post-change renderer CSS were compared as 1300 selector|property pairs and every value was identical; the only structural change is the intended rule split."
    - "Config boundary check passed 41 assertions over the served spec, accepted patches, 16 rejection cases, projection of hand-edited config and provider listing."
    - "Control page verified in a real browser against the built artifact with a stub bridge fed by the real backend spec: all four sections and ten fields render from the schema, the provider picker lists real providers, an inline field error appears for a blanked required field, the dirty indicator and save enable/disable work, and a save clears the dirty state."
    - "Desktop settings broker passed 26 boundary assertions: offline rejection, list and set round trips through the real protocol builder, option and timestamp capture, client rejection propagation without caching, timeout with pending cleanup, waiter release on disconnect, stray reply rejection, and the offline payload still listing every declared setting."
    - "Control page verified against a stub client in both states: connected, the microphone picker lists the client's options, selecting a device posts set and the reported timestamp updates; offline, the status reads not connected, the control is disabled, the last report time is shown and the refresh button is disabled."
  evidence_gap:
    - "The active plugin was not reloaded; opening the view and exercising authenticated API requests in the live AstrBot Dashboard remains unverified."
    - "Desktop-local device controls and live motion preview beyond the microphone remain unexposed by the broker."
    - "Electron desktop windows were verified by compiled-CSS parity and typecheck only; no live Electron run confirmed the unchanged desktop appearance."
    - "The new control/config/schema route, the field-anchored save rejection and the desktop settings broker were exercised through a stub bridge and a fake client, not against a live reloaded AstrBot and a running desktop app."
    - "A failure in control/samples still raises the page-level error banner even though motion tuning is not the active section."

