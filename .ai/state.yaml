task:
  class: review
  risk: high
  phase: end_to_end_source_review
  status: implementation_in_progress
  scope: "Review the adapter, frontend playback, ModelEngine, ParameterMixer, and WebSDK ownership chain; fix each source-confirmed defect directly and commit it separately."

context:
  confidence: high
  assumptions:
    - Phase one feature scope remains complete, but this does not imply that the current source is defect-free.
    - Only source-confirmed unresolved defects belong in the active defect register; resolved, invalid, speculative, and historical findings are removed.
    - Performance work must distinguish existing foundations from remaining implementation instead of describing completed capabilities as future work.
    - Remote Operator, VTS recording, small-model training, Physics diagnostics, and productization keep their own boundaries and do not become Performance Director responsibilities.
    - Segment-level output rejection must not close the WebSocket; session-store and connection infrastructure failures remain fatal.
    - The existing MotionLab outbound queue is the only persistence path for frontend rejection diagnostics.
    - A rejected atomic segment is a settled SessionStore fact: none of its individual materials are released, but it still participates in synth_finished and failed playback acknowledgement.
    - Frontend sessions retain only recent terminal history, and the backend terminal idempotency ledger retains at most 256 completed turns per connection.
    - Pending motion identity is the normalized Turn/Message pair, and duplicate delivery is not replacement semantics.
    - Rejecting a later duplicate must not mutate, fail, or resynchronize the first pending payload.
    - The existing PlaybackTimeline sink remains the lifecycle owner; this fix must not add a queue, dedupe layer, or fallback.
    - ModelEngine timing compilation owns blend and hold budgets; WebSDK consumes the validated result and must not invent a second timing policy.
    - The minimum legal motion duration is 320 ms, so the existing 80 ms entry and 120 ms release leave at least 120 ms for idle hold.
    - A semantic parameter binding output range is meaningful only when minimum is strictly less than maximum; inversion remains represented by the existing invert field.
    - Profile validation owns this invariant. ModelEngine must not become a fallback validator for malformed synchronized profiles.
    - Disconnect cleanup is resource release, not runtime fallback: each owner must attempt its own cleanup, emit precise diagnostics on failure, and never preserve stale connection state merely because another owner failed first.
    - Event stop-flag publication and Event stopping are independent cleanup operations; failure of one must not suppress the other.
    - SpeechIngress allocates or receives input identities before a formal Turn exists; only TurnCoordinator._commit_inbound_message owns identity registration and control.turn_started publication.
    - A pre-Turn input failure must remain observable through control.error, but it must not fabricate a terminal event for a session that was never started.
    - control.playback_finished and control.interrupt carry frontend Turn IDs by protocol contract; their handlers must not query the AstrBot-to-frontend index with those values.
    - Normalized motion dispatch must handle every declared payload kind explicitly; unknown runtime values are rejected and never reinterpreted as another motion kind.
    - Binary audio header bytes 6-7 are reserved flags in little-endian order; the current frontend writer sets them to zero and the backend parser owns enforcing that invariant.
    - Renderer keyboard events bubble through document to window; PTT must listen on one DOM owner only, while Electron global-hook events remain a separate IPC source.
    - Direct Parameter Plan DTOs are an application-to-WebSDK boundary contract and must live outside the WebSDK implementation directory.
    - WebSDK retains execution preparation ownership and re-exports the neutral contract only to preserve existing internal imports, not as a second type definition.
    - The ModelEngine parser is the only runtime schema owner for parameter_plan.v3; WebSDK must continue consuming validated plans without a duplicate parser.
    - Unknown fields are protocol errors rather than optional extension points and must report their exact object path.
    - AstrBot TurnDeliveryCoordinator owns the sequence of after_message_sent Hook dispatch followed by visible-turn completion.
    - The plugin platform event owns how completion closes the AG99 output queue, but the plugin must not invoke that completion from its own Hook.
    - Remote Operator requires the enhanced Core Interaction Prompt/Result contributor lifecycle; official compatibility mode does not promise this capability.
    - Official compatibility mode must not create RemoteOperatorRuntime or probe configured endpoints when no request/result lifecycle exists.
    - `src/types/compiledSemanticMotion.ts` is a shared contract module and must not own runtime cloning or parsing dependencies.
    - The unique CompiledSemanticMotion runtime parser belongs to ModelEngine compiler and is shared by MotionLab transport and desktop snapshot projections.
    - Enhanced-Core Remote Operator contributors depend on the formal AstrMessageEvent get/set-extra and platform identity APIs; failures must remain visible.
    - Toolset shape adaptation may distinguish `get_tool()` from a tools list, but an exception from an available API must not be converted into “tool absent.”
    - Parsed output segments may be rejected without terminating the transport: domain-invalid material is committed as a settled rejected fact, while duplicate, late, or terminal-session delivery rejects only the attempted write and preserves the first segment.

documentation:
  authorities:
    phase_status: docs/01-架构与结构/06-一期完成边界与二期入口.md
    active_defects: docs/02-设计文档/20-端到端链路已确认问题与修复边界.md
    performance_roadmap: docs/02-设计文档/18-二期角色表演系统总体规划.md
    performance_source_audit: docs/02-设计文档/19-角色表演主流程与编排职责审计.md
    remote_operator_boundary: docs/02-设计文档/07-远程执行器接入设计.md
    training_and_vts_boundary: docs/05-小模型训练/01-动作小模型训练前置条件与职责边界.md
  rules:
    - README and diagram indexes may summarize and link, but do not own phase, defect, or next-step lists.
    - Fixed defects are deleted from the active register after source review; they are not retained as history.
    - Source audit documents describe current ownership and completed migrations, not a second roadmap.

verification:
  policy:
    - Use source tracing, type/static checks, git diff review, and the smallest available boundary smoke check.
    - Automated tests are low-confidence input/output smoke checks; do not run the full suite.
    - Live AstrBot, Electron, TTS, and Live2D behavior remains user-led runtime acceptance.
  current:
    - The previous Remote Operator error-visibility correction is committed as `e4fe844`.
    - The broader end-to-end source review is in progress; the active defect register remains empty until a finding is source-confirmed.
    - ESP32 display initial status read failures are visible after commit `0a0da08`.
    - Pre-Turn exceptions remain outside the formal lifecycle after commit `42681e8`.
    - Audio start/end payload shape is owned by the protocol parser, while SpeechIngress rejects duplicate starts, missing starts, mode changes, and non-increasing chunk sequences instead of repairing or ignoring them.
    - The obsolete base64 JSON audio-chunk route is removed; production microphone audio has one binary-frame path.
    - The WebSocket protocol document now distinguishes capture identities from formal Turn identities.
    - Frontend output-segment commit now returns an explicit committed/rejected result; duplicate and late segment delivery no longer escape as fatal WebSocket handler exceptions.
    - Playback lifecycle documents and detailed Mermaid diagrams distinguish parser rejection, settled rejected segments, and non-destructive duplicate/late rejection.
    - Server-info and output-segment media URLs are rejected at the protocol parser unless they use the declared absolute URL schemes; URL host rewriting no longer converts parse failures into unchanged values.
    - Omitted primary semantic axes are valid by prompt contract and no longer generate fake missing-axis warnings; obsolete axis-error tolerance diagnostics were removed, while unknown and forbidden axes remain explicit compile rejections.
    - Motion prompt semantic-profile resolution now propagates its original exception and traceback instead of converting every failure into a synthetic profile-unavailable error string.
    - Static HTTP API handler exceptions remain isolated at the request boundary, but now retain a server traceback and no longer expose internal exception text to clients.
    - Live2D manager update and draw failures are no longer reclassified as Direct Parameter Plan failures merely because a plan was active at frame start; ParameterMixer remains the precise owner of plan-frame rejection.
    - Playback execution-state subscribers are notified after the current owner stack unwinds; state changes raised during delivery schedule a later microtask instead of synchronously re-entering the Orchestrator or being discarded.
    - Catalog motions are a ready-model, preloaded-cache execution path. Runtime cache misses and model-not-ready states are explicit rejections; there is no second asynchronous fetch or preparing-run lifecycle, and a rejected request cannot clear another run's clock or lend it a stale start error.
    - Live2D renderer selection changes now use one serialized lifecycle: empty model sync, replacement, initialization failure, and component unmount all release the WebSDK instance through its public teardown owner; superseded loads cannot publish ready/error state for the current selection.
    - Live2D teardown clears singleton ownership before invoking release work, completes all owned cleanup steps even when terminal callbacks fail, logs every cleanup failure, and rethrows the original first failure after cleanup.
    - Catalog motion replacement is committed only after Cubism returns a valid playback handle; rejected candidates preserve the current player state, and natural completion is tracked by the per-run handle rather than a callback stored on the shared preloaded motion object.
    - ModelEngine public execution state belongs to the active playback run; pending, compile, and start failures from replacement candidates remain diagnostics and cannot overwrite a still-playing run.
    - Direct Parameter Plan and Catalog Motion starts return the same structured started/rejected result; ModelEngine receives the actual rejection reason instead of inferring errors from mutable player display text.
    - Motion lifecycle fan-out isolates ModelEngine, Timeline, recorder, caller, and desktop-bridge observers; RunTracker and recorder commit their own ownership transitions before invoking downstream projections so one observer failure cannot strand another owner.
    - Live AstrBot, Electron, TTS, ESP32, and Live2D runtime acceptance remains user-led.
