state_meta:
  schema_version: 3
  updated_at: '2026-11-13'
  purpose: 当前架构计划、所有权边界、不变量和验收缺口。历史里程碑保留在 Git 历史，不在此重复。
  baseline: AG99live 1.0.0
  code_checkpoint: 337aa0b5
  followup_checkpoint: 400e8ad3

architecture:
  product:
    typescript_desktop: 持续开发和表现参考实现
    native_desktop: 冻结版本后的独立高性能实现
    adapter: 唯一持久化配置源和单桌面 WebSocket 对端
    runtime_selection: TS 与 Native 手动择一连接 Adapter，不并行连接
  ownership:
    adapter:
      owns:
        - desktop_runtime_settings canonical snapshot
        - protocol session and single-client admission
        - conversation, provider, TTS and media production
    runtime_core:
      owns:
        - wire schema validation
        - RuntimeProtocolSession
        - typed protocol events and builders
    native_runtime:
      owns:
        - turn/segment/playback ledger
        - connection generation
        - terminal and playback_finished coordination
        - settings application result
    native_transport:
      owns:
        - Native Adapter WebSocket lifetime
        - text/binary receive and send callbacks
        - reconnect URL
    native_input:
      owns:
        - WinMM microphone device and stream lifecycle
        - PCM uplink and input stream terminal state
    native_playback:
      owns:
        - audio worker
        - complete WAV and OLV PCM admission
        - playback clock, RMS, audio credit and drain
    native_motion:
      owns:
        - motion intent subset compilation
        - parameter plan parsing
        - bounded/spring scheduling and terminal state
    native_model:
      owns:
        - Cubism model/resources
        - Physics/Pose/Expression
        - parameter contribution and single write path
        - model view, ambient motion and cursor gaze
    native_host:
      owns:
        - HWND, tray, input window and drag/click-through
        - D3D11 composition surface and frame loop
        - Native reconnect command
    spout:
      owns:
        - optional D3D11 backbuffer readback
        - bounded RGBA sender worker
        - AG99liveSpoutSender process lifecycle

  data_flow:
    downlink: Adapter -> runtime-core -> NativeTransport -> NativeRuntimeCoordinator
    render: NativeRuntimeCoordinator -> MotionScheduler/NativeModel -> Cubism render thread
    audio: NativeRuntimeCoordinator -> NativePlaybackRuntime/AudioRuntime -> waveOut
    uplink: NativeInputRuntime -> runtime-core -> Adapter
    receipt: audio/motion/text terminal evidence -> one playback_finished path

  config:
    source_of_truth: Adapter desktop_runtime_settings
    native_behavior:
      - receive canonical values during connection replay
      - keep effective values in memory
      - return explicit applied/rejected/unsupported results
      - never create a second persistence store
    native_supported:
      - live2d_physics_response_scale
      - live2d_ambient_motion_enabled
      - model_view_scale
      - model_view_offset_x
      - model_view_offset_y
      - motion_engine_intensity_scale
      - speech_volume
      - microphone_device
      - cursor_gaze_enabled
      - cursor_gaze_poll_interval_ms
      - cursor_gaze_dwell_ms
      - cursor_gaze_stationary_distance_px
      - adapter_address
      - spout_enabled

  invariants:
    - one Adapter WebSocket client per Adapter instance
    - one Native transport owner
    - one playback ledger and one playback_finished authority
    - one audio clock shared by complete and OLV playback
    - render thread is the only Cubism state writer
    - audio/input workers never call Cubism
    - late events modify ledger state and never reopen devices directly
    - TS and Native do not write the same model concurrently
    - unsupported settings remain canonical and are not silently accepted

  code_status:
    architecture: Phase 1-4 source migration complete; boundary follow-up committed
    native_runtime: coordinator, transport, input, playback and model boundaries present
    typescript_runtime: foundation, desktop host port and SessionStore port present
    spout: source and Release resource copy present; receiver acceptance pending
    local_validation:
      - render-core Release build
      - 3/3 CTest smoke targets
      - frontend renderer/WebSDK/Node typecheck
      - YAML parse and git diff check
      - Native host process/window startup observation

  explicit_boundaries:
    - full TypeScript PerformanceSchedule/compiler equivalence remains a reference-implementation migration, not a V1 replacement gate
    - Native microphone VAD and FFT speech emphasis remain outside the current stable slice
    - window resize and D3D device-loss recovery are not implemented
    - screenshot/PTT/Bilibili/ESP32 remain TS/Electron-owned features unless a Native owner is added deliberately

live_acceptance:
  required:
    - Adapter canonical settings replay and Native reconnect
    - visible Mk6 model, motion, Physics and lip-sync quality
    - WAV/OLV waveOut timing, interruption and drain
    - real microphone enumeration, switching and capture
    - cancel, reconnect, late motion and unique receipt behavior
    - Spout/OBS frame output, transparency, cadence and shutdown
    - TS/C++ motion golden samples
  rule: local smoke/build evidence must not be reported as TS/Native behavioral equivalence

test_commands:
  native_build: cmake --build render-core/build --config Release --parallel 4
  native_tests: ctest --test-dir render-core/build -C Release --output-on-failure
  frontend_types: npm run typecheck
  state_parse: python -c "import yaml; yaml.safe_load(open('.ai/state.yaml', encoding='utf-8'))"
  whitespace: git diff --check
