verification:
  policy:
    - Use source tracing, type/static checks, git diff review, and the smallest available boundary smoke check.
    - Automated tests are low-confidence input/output smoke checks; do not run the full suite.
    - Live AstrBot, Electron, TTS, and Live2D behavior remains user-led runtime acceptance.
  current:
    - Electron pet and overlay windows now carry their renderer role through the URL/query boundary and remain hidden until their own renderer has finished loading; overlay display also requires the pet window to be visible.
    - Overlay content height is fixed at the window boundary; the ResizeObserver -> IPC -> BrowserWindow resize handshake was removed, so input rendering no longer depends on a post-mount transparent-window resize.
    - Motion sink start rejection, synchronous start exceptions, invalid motion release timestamps, and timeline preparation failures now all enter the existing motion rejection and required-sink terminal path; a confirmed start is marked released only after the sink accepts it.
    - "`npm run typecheck:renderer`, `npm run typecheck:node`, `npm run typecheck:websdk`, and `git diff --check` remain required for this batch; live Electron, audio, and Live2D acceptance is still user-led."
    - Audio-backed motion sinks now remain required for terminal settlement but no longer block the shared Timeline from entering `playing`; the real audio-start callback therefore delivers an `audio / playing` clock to ModelEngine instead of leaving motion pending behind an aggregate startup deadlock.
    - MotionRuntimeScheduler again consumes pending motion only from an authoritative `audio / playing` or `paused` Timeline snapshot; it no longer accepts an audio-preparing callback as a startup shortcut.
    - "`npm run typecheck:renderer`, `npm run typecheck:websdk`, and `git diff --check` pass for the Timeline startup-gate correction. The existing PlaybackTimeline smoke command remains blocked by pre-existing strict-type errors in the frozen Cubism Framework test compilation; no test workaround was added."
    - Motion rejection now always forwards the existing segment interruption to the ModelEngine motion sink before settling the session projection, so pending inbound payloads and prepared semantic motions cannot survive a pre-start rejection; no second cleanup owner was added.
    - Timeline Clock reports `audio_pending` until the Timeline itself starts, and its attached audio time is monotonic; motion resources keep their prior elapsed-time baseline when the playback reader regresses instead of advancing from the rollback.
