desktop_settings_canonical_owner_20261111:
  date: '2026-11-11'
  class: feature
  risk: high
  status: source_updated_pending_runtime_acceptance
  decision: Adapter plugin configuration owns the canonical desktop runtime settings snapshot per platform instance. The Web
    control page edits that snapshot; connected TS or Native clients apply it through the existing desktop settings query
    protocol. A first connected client is imported into the snapshot, and later client reconnects reapply the saved values.
    Client local storage is an application cache, not the source of truth.
  scope: Persist successful desktop setting responses under desktop_runtime_settings, merge the persisted snapshot into offline
    Web control responses, migrate the first connected client's values, and replay canonical values during WebSocket initialization.
    Preserve the existing one-client broker and unsupported-setting behavior.
  validation: Python compilation, frontend typecheck and diff whitespace checks passed. Ten focused Adapter tests passed,
    including plugin config persistence, platform scoping, broker timing, unsolicited client updates, and WebSocket binary
    transport. No live TS/Native reconnect or multi-setting runtime acceptance was run.
  remaining: Native still needs per-setting application support beyond Physics; values for unsupported keys remain canonical
    and are retried on a compatible client. The TS local settings window now emits canonical updates, but live Web-to-TS/Native
    reconnect verification remains pending.
