state_meta:
  schema_version: 3
  updated_at: '2026-11-15'
  purpose: 当前架构计划、所有权边界、不变量和验收缺口。历史里程碑保留在 Git 历史，不在此重复。
  baseline: AG99live 1.0.0
  code_checkpoint: 337aa0b5
  followup_checkpoint: 400e8ad3

architecture:
  product:
    typescript_desktop: 持续开发和表现参考实现
    native_desktop: 冻结版本后的独立高性能实现
    adapter: 唯一持久化配置源和单桌面 WebSocket 对端
    runtime_selection: TS 与 Native 手动择一连接 Adapter，不并行连接
  ownership:
    adapter:
      owns:
        - desktop_runtime_settings canonical snapshot
        - protocol session and single-client admission
        - DesktopStateStore connection and capture-side protocol state
        - desktop frame and presence inputs submitted to AstrBot Core SnapshotHub
        - conversation, provider, TTS and media production
    interaction_orchestrator:
      owns:
        - neutral Turn admission and terminal registry
        - active AstrBot event registry and turn timing facts
        - provider event routing and lifecycle cleanup coordination
    desktop_awareness_plugin:
      owns:
        - desktop frame comparison and baseline
        - desktop return detection from Presence snapshots
        - desktop_changed and desktop_returned Runtime Observation submission
    runtime_core:
      owns:
        - wire schema validation
        - RuntimeProtocolSession
        - typed protocol events and builders
    native_runtime:
      owns:
        - turn/segment/playback ledger
        - connection generation
        - terminal and playback_finished coordination
        - settings application result
        - Adapter handshake and idempotent start_mic control
    native_transport:
      owns:
        - Native Adapter WebSocket lifetime
        - text/binary receive and send callbacks
        - reconnect URL
    native_input:
      owns:
        - WinMM microphone device and stream lifecycle
        - PCM uplink and input stream terminal state
    native_playback:
      owns:
        - audio worker
        - complete WAV and OLV PCM admission
        - playback clock, RMS, audio credit and drain
    native_motion:
      owns:
        - motion intent subset compilation
        - parameter plan parsing
        - bounded/spring scheduling and terminal state
    native_model:
      owns:
        - Cubism model/resources
        - Physics/Pose/Expression
        - parameter contribution and single write path
        - model view, ambient motion and cursor gaze
    native_host:
      owns:
        - HWND, tray, input window and drag/click-through
        - D3D11 composition surface and frame loop
        - Native reconnect command
        - bounded desktop screenshot capture for AG99 observation requests
        - bounded desktop presence sampling for AG99 presence requests
    spout:
      owns:
        - optional D3D11 backbuffer readback
        - bounded RGBA sender worker
        - AG99liveSpoutSender process lifecycle

  data_flow:
    downlink: Adapter -> runtime-core -> NativeTransport -> NativeRuntimeCoordinator
    render: NativeRuntimeCoordinator -> MotionScheduler/NativeModel -> Cubism render thread
    audio: NativeRuntimeCoordinator -> NativePlaybackRuntime/AudioRuntime -> waveOut
    uplink: NativeInputRuntime -> runtime-core -> Adapter
    receipt: audio/motion/text terminal evidence -> one playback_finished path

  config:
    source_of_truth: Adapter desktop_runtime_settings
    native_ui: none; all supported runtime settings are configured through the Adapter Web page
    native_behavior:
      - receive canonical values during connection replay
      - keep effective values in memory
      - return explicit applied/rejected/unsupported results
      - never create a second persistence store
    native_supported:
      - live2d_physics_response_scale
      - live2d_ambient_motion_enabled
      - model_view_scale
      - model_view_offset_x
      - model_view_offset_y
      - motion_engine_intensity_scale
      - speech_volume
      - microphone_device
      - cursor_gaze_enabled
      - cursor_gaze_poll_interval_ms
      - cursor_gaze_dwell_ms
      - cursor_gaze_stationary_distance_px
      - adapter_address
      - spout_enabled
      - bilibili_live_enabled
      - bilibili_live_room_id
      - bilibili_live_cookie
      - bilibili_live_response_interval

  versioning:
    source_of_truth: VERSION
    current: 1.0.0
    required_match:
      - root package.json
      - frontend package.json and package-lock.json
      - Adapter metadata.yaml
      - Runtime Core and Render Core CMake project versions
    sync_command: python scripts/sync_version.py
    check_command: python scripts/check_version_consistency.py

  invariants:
    - one Adapter WebSocket client per Adapter instance
    - one Native transport owner
    - one playback ledger and one playback_finished authority
    - one audio clock shared by complete and OLV playback
    - render thread is the only Cubism state writer
    - audio/input workers never call Cubism
    - late events modify ledger state and never reopen devices directly
    - TS and Native do not write the same model concurrently
    - unsupported settings remain canonical and are not silently accepted

  code_status:
    architecture: Phase 1-4 source migration complete; ambient action mixing follow-up is in the working tree
    native_runtime: coordinator, transport, input, playback and model boundaries present
    typescript_runtime: foundation, desktop host port and SessionStore port present; AmbientActionDirector/Scheduler, multi-source idle plans, bounded release overlap and foreground/thinking parameter mixing present
    motion_compiler: Native semantic-axis budget, repeated-direction attenuation and parameter-plan execution present
    pre_action: output.pre_action protocol and isolated Native reaction slot present
    idle_motion: output.idle_motion protocol, expiry enforcement and multi-source TypeScript idle parameter plans with gradual release present
    handshake: server_info and desktop_settings_sync_complete validation present
    desktop_presence: Native input-idle presence snapshot and return confirmation path present
    bilibili: Native public-room danmaku bridge and shared settings path present; live acceptance pending
    window_management: Native resize updates D3D11 surface and model projection; device-loss recovery pending
    desktop_capture: Native screenshot request/result protocol and bounded JPEG capture present; live acceptance pending
    spout: source and Release resource copy present; receiver acceptance pending
    local_validation:
      - render-core Release build
      - 3/3 CTest smoke targets
      - frontend renderer/WebSDK/Node typecheck
      - TypeScript ambient multi-source mixing source review
      - product version consistency check across Desktop, Adapter and CMake
      - YAML parse and git diff check
      - Native host process/window startup observation

  explicit_boundaries:
    - full TypeScript PerformanceSchedule/compiler equivalence remains a reference-implementation migration, not a V1 replacement gate
    - Native microphone VAD and FFT speech emphasis remain outside the current stable slice
    - D3D device-loss recovery is not implemented
    - desktop screenshot and Presence capture remain AG99live capabilities; desktop-change comparison, returned-event admission, Observation submission and Personal Policy remain AG99 plugin/Core responsibilities
    - settings/history/Action Lab/Profile Editor and their auxiliary windows are outside Native; runtime settings are configured through the Adapter Web page
    - PTT/ESP32 remain TS/Electron-owned features unless a Native owner is added deliberately

live_acceptance:
  required:
    - Adapter canonical settings replay and Native reconnect
    - visible Mk6 model, motion, Physics and lip-sync quality
    - WAV/OLV waveOut timing, interruption and drain
    - real microphone enumeration, switching and capture
    - cancel, reconnect, late motion and unique receipt behavior
    - Spout/OBS frame output, transparency, cadence and shutdown
    - Bilibili public-room connection, danmaku parsing, batching and reconnect
    - Native screenshot request/result capability with bounded JPEG capture
    - Native window resize with model projection and Spout dimensions
    - TS/C++ motion golden samples
  rule: local smoke/build evidence must not be reported as TS/Native behavioral equivalence

test_commands:
  native_build: cmake --build render-core/build --config Release --parallel 4
  native_tests: ctest --test-dir render-core/build -C Release --output-on-failure
  frontend_types: npm run typecheck
  version_check: python scripts/check_version_consistency.py
  state_parse: python -c "import yaml; yaml.safe_load(open('.ai/state.yaml', encoding='utf-8'))"
  whitespace: git diff --check

obs_web_subtitles:
  status: deployed_pending_reload_and_live_acceptance
  scope: >-
    User requested a Web version of the current subtitles matching the supplied
    purple card and editable CSS; keep the existing desktop subtitle window.
    Add a loopback subtitle HTTP/SSE service in the presentation Adapter, a
    separate preview/CSS editor and persistent custom.css with live reload.
    TypeScript and Native clients report actual playback caption facts using
    the additive system.subtitle_state / ag99.subtitle.v1 message. OBS is a
    read-only subscriber and never owns audio or terminal acknowledgements.
  validation: >-
    Scoped Ruff and JavaScript syntax checks passed. Renderer typecheck, full
    Electron production build and Native Release build passed. Browser compared reference and implementation
    at 817x208 and verified draft isolation, save/hot apply and reset. Actual
    HTTP/SSE boundary smoke verified caption projection, terminal clear,
    reconnect snapshot, rejected cross-origin CSS write and file hot reload.
    Preview uses the actual AstrBot API. Review fixes were validated with scoped
    Ruff, JavaScript syntax checks, Electron production build and one real
    HTTP/SSE case rejecting an old segment clear while retaining the new caption.
  review_fixes: >-
    Preserve turn/segment identity through ended/failed playback callbacks and
    reject mismatched clear facts. Track the CSS version actually submitted
    while editing during save, reload styles on SSE reconnect, and start the
    optional HTTP service inside the Adapter cleanup boundary.
  remaining: >-
    Adapter has been deployed by deploy_adapter.ps1. Reload AstrBot and use an
    updated desktop build. Actual TTS/Live2D/OBS acceptance remains pending. Preserve
    unrelated concurrent edits, including edits in Native coordinator and
    platform adapter. User requested review and a scoped subtitle commit.
