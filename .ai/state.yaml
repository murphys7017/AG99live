task:
  class: bugfix
  risk: medium
  phase: motion_intent_v3_playback_path_stabilization
  scope: AG99live adapter interaction motion client_objects, frontend turn playback orchestration, and ModelEngine started-event completion handoff
context:
  confidence: medium
  assumptions:
    - The automatic LLM motion path remains pure engine.motion_intent.v3 semantic axes; catalog motion, motion3, exp3, and choice outputs stay out of this path.
    - middleware-first and inline-first remain separate routes; middleware-first reads plugin_hints.ag99live_motion, inline-first reads the inline anim contract only.
    - AstrBot core is responsible for merging InteractionResultContribution.client_objects into final platform_extras for the delivered visible message.
    - Frontend text/audio/motion playback is segment-scoped by visible message_id and turn_id; motion should be released through the same turn playback orchestrator as text and audio.
    - ModelEngine playPlan returning true means the motion should be considered started for turn completion, even if the underlying player implementation omits its optional onStarted callback.
  unresolved_questions:
    - Runtime validation still needs a fresh AstrBot + Electron run to confirm logs show one output.text, one engine.motion_intent, and ModelEngine playback for the same visible message_id.
architecture:
  stability: evolving
  boundary_changes:
    - Interaction motion result contributors now use client_objects as the single authoritative motion object output; platform_extras.client_objects is left to AstrBot core merge/build logic.
    - Turn playback orchestrator feeds motion readiness before no-audio/output-queue release signals for the same active segment, avoiding a late-motion fallback path when state arrives in one batch.
    - ModelEngine emits a plan-started event after successful playPlan even when the player does not invoke the optional onStarted callback, preventing motion payloads from blocking turn settlement.
