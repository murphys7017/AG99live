audio_segment_sync_20261111:
  class: bugfix
  risk: high
  status: source_updated_pending_live_audio_acceptance
  scope: Preserve first samples by finishing PCM gain ramp before scheduled audio; keep media gain open before the playing
    callback; analyse post-gain audio. Decode queued PCM on bounded wire admission. Schedule at most one segment ahead against
    the preceding finished output's AudioContext tail; transfer presentation and lip-sync ownership after the preceding segment
    settles. Account for scheduled wait in start deadlines and cancel queued output on interruption. Apply a 1 ms onset ramp
    and appended 1 ms return-to-zero guard without dropping or overlapping received samples.
  validation: Renderer typecheck and PCM decode boundary smoke passed. A minimal PCM public boundary smoke with a simulated
    audio scheduler confirmed adjacent segment times, retained sample count, boundary ramps and rejection after finish. Review
    corrections reject scheduling after failed production and suppress late end guards; minimal public-boundary smoke checks
    pass for both. This is not output-device or end-to-end evidence. No real TTS and recording comparison yet. Source commit
    authorized; deployment remains out of scope.
  limitations: Continuous scheduling depends on next-segment data arriving before the previous scheduled tail; network/TTS
    starvation still creates real gaps. Live recording comparison, interruption and subtitle/lip handoff acceptance remain
    required. AudioContext clock is not yet compensated to device output. Mk6 declares mouth form, funnel and width controls
    but LipSync only uses ParamMouthOpenY. Phoneme-driven mouth shapes remain outside this first slice.
native_olv_native_playback_20261110:
  class: feature
  risk: high
  status: source_updated_locally_validated_pending_live_runtime_acceptance
  scope: Complete the Native OLV presentation path behind the existing desktop capability flag. Track incremental text/audio/motion
    terminal state per segment, feed accepted PCM into the existing lip-sync/RMS clock, coalesce the latest validated motion
    payload and release it through NativeModel's existing motion queue after audio drain, and include OLV segments in the
    existing playback_finished gate. Keep the TS timeline and Core/Adapter wire contracts unchanged; Native text remains preview/feedback
    state because the Native host has no separate history store.
  validation: Render-core Release host build, runtime-core Release protocol smoke test, CTest, and git diff whitespace checks
    pass. The capability is opt-in through AG99_NATIVE_OLV=1 and remains off by default. Source review confirms OLV text,
    PCM, motion and terminal acknowledgement share one turn/segment lifecycle. No real Adapter/Core/TTS/audio-device/Live2D
    joint run has been completed in this slice.
  limitations: Native motion is released as a motion-only plan after the corresponding PCM stream drains and only the latest
    OLV motion update is retained. A motion tail beyond the frontend 1.8-second limit is rejected, and motion plan replacement
    is treated as a normal handoff. A paired runtime acceptance is still required to verify provider timing, waveOut device
    admission, interruption/reconnect cleanup, and visible model output. Existing Native history UI is preview-only by design;
    the Adapter/TS path remains responsible for desktop history recording.
native_olv_protocol_boundary_20261110:
  class: feature
  risk: high
  status: source_updated_locally_validated_pending_native_runtime_acceptance
  scope: Extend runtime-core with the first OLV downlink protocol boundary without changing the existing output.segment.v6
    or microphone type=1 paths. Parse incremental text/audio/motion stream events, shared identity and sequence constraints,
    end status/length fields, and type=2 PCM frame metadata, sample offsets, and bounded payloads. Track turn/segment/resource
    stream lifecycles, text and audio capacities, and cross-segment audio order before dispatching accepted OLV events through
    new optional callbacks. Add the frontend `control.audio_credit` builder and Native `system.desktop_runtime_settings` capability
    declaration for the later PCM worker; add a bounded single Native PCM worker and waveOut block sink that sends cumulative
    credit after device admission, while keeping `persona_segment_stream_enabled=false` until timeline/lip-sync/text/motion
    presentation is wired.
  validation: runtime-core Release build and CTest protocol smoke test pass, including direct event parsing, type=2 frame
    parsing, lifecycle rejection, OLV-only synth_finished handling, audio credit construction, capability declaration, and
    RuntimeProtocolSession dispatch. Both runtime-core and render-core Release builds pass, and Git whitespace checks pass.
    Live Adapter/Core/ WebSocket and real audio/Live2D playback acceptance remain outstanding. The worker sink is compile-
    and lifecycle-validated but not enabled in capability negotiation; sink/admission/credit failures interrupt and clear
    the affected Turn; audio end status/reason and total sample count are checked before successful drain. Text preview and
    the existing 50 Hz RMS signal now have Native ingress, while Timeline/lip-sync clock ownership, incremental motion presentation,
    and final playback receipt remain outstanding. The review pass additionally corrected Unicode codepoint end lengths, adapter-source
    validation, cumulative audio-credit consistency, and the Native connection-state update after capability-send failure.
  limitations: This is still a receive/validation boundary only. It does not yet enforce audio credit or backpressure, bounded
    playback queues, PCM sink timing, or Live2D motion execution. The next slice must connect these callbacks to the existing
    runtime ownership without creating a parallel player.
native_runtime_protocol_and_frame_clock_20261110:
  class: refactor
  risk: high
  status: source_updated_locally_validated_pending_native_runtime_acceptance
  scope: Continue the C++ native runtime migration without changing the stable TS desktop behavior. Align runtime-core with
    output.segment.v6, derive Native protocol constants from the Adapter schema manifest at CMake configure time, and reuse
    one monotonic timestamp per render frame for audio, parameter mixing, and motion-plan evaluation. Cache model parameter
    IDs at load time and remove transient per-frame source-label and parameter-ID allocations from the parameter mixer without
    changing priorities. Add an idle fast path after pending Physics settings are applied, so empty frames skip contribution
    collection and mixing. Reuse the render-thread frame scratch vectors for active frames to avoid repeated container allocation,
    including the per-parameter contribution lists used by the mixer. Add a repeatable PowerShell sampler for Native CPU and
    memory baselines. Replace the Native WAV temporary-file/PlaySound path with in-memory PCM playback through `waveOut`,
    while keeping the existing serial, RMS, clock, interruption, and failure boundaries. Accept v6 pending motion and same-identity
    `output.segment_motion`, attaching late motion to the active audio clock and rejecting expired motion windows.
  validation: CMake Release builds pass for runtime-core and render-core, the protocol replay smoke test passes, the manifest
    check and Ruff pass, and git diff whitespace checks pass. The Native sampler was smoke-tested with a short Mk6 run. Changes
    are confined to the AG99live source repo; the generated AstrBot deployment copy was not edited or deployed.
  limitations: Native rendering, audio timing, GPU occupancy, and protocol behavior still require paired live acceptance against
    the Adapter and a real model. No performance percentage is claimed without a before/after native benchmark.
