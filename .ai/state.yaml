task:
  class: maintenance
  risk: medium
  phase: review_complete
  status: complete
  scope: Keep one current architecture, remove historical documents and stale guidance, and align documentation with the live message, motion, and playback chain.

context:
  confidence: high
  assumptions:
    - AG99live is an active-development desktop Live2D system; obsolete documents, code, and tests are deleted instead of archived in the repository.
    - The main model emits assistant text and one ag99live.motion Persona Effect in the same logical response.
    - The official AstrBot <@anim> v3 entry exists only when Persona Effect injection is unavailable; it is not a recovery path for invalid v4 motion.
    - Remote computer control remains because AstrBot may run on a server while the Electron client runs on the user's computer.
    - Performance curve generation is optional and never delays TTS or segment release.

architecture:
  product_flow:
    - User input is forwarded to AstrBot without an AG99-owned busy queue or input rejection gate.
    - AstrBot produces canonical assistant text, TTS generation state, audio material, and Persona Effect data.
    - The adapter aggregates one output.segment.v3 per turn_id plus message_id and sends it atomically.
    - The frontend SessionStore commits the segment once; the orchestrator releases one segment job.
    - PlaybackTimeline owns audio, subtitle, motion, and lip-sync sink lifecycle.
    - ModelEngine compiles semantic motion into a parameter plan or typed resource execution.
    - Live2D WebSDK owns model readiness, per-frame parameter writes, speech energy, lip sync, dynamics, and physics.
  identity:
    turn_id: Conversation turn identity shared across AstrBot, adapter, frontend, and Motion Lab.
    message_id: Logical assistant output segment identity; immediate and final outputs are distinct segments.
    tts_request_id: One TTS generation lifecycle, including retries or multiple audio segments.
    run_id: One accepted motion execution owned by one segment.
  protocols:
    output: output.segment.v3
    persona_motion: engine.motion_intent.v4
    official_inline_motion: engine.motion_intent.v3
    parameter_plan: engine.parameter_plan.v2
    performance_curve: ag99.performance_curve_hint.v1
    voice_following: ag99.voice_following_profile.v2
  motion_ownership:
    llm: intent_tags, axis_levels from -4 to 4, motion_steps, and optional typed resource intent.
    adapter: Persona Effect registration, strict schema/profile/resource validation, identity binding, and transport.
    model_engine: Level sampling, intensity, coupling, timing, speech gesture planning, relation graph constraints, plan building, and resource policy.
    playback_timeline: Segment-scoped clock and required/optional sink lifecycle.
    live2d_websdk: Exact parameter resolution, per-frame interpolation, lip sync, speech energy, dynamics, and physics.
  playback_rules:
    - Audio-backed subtitle, motion, and lip sync use the matched HTMLAudioElement playing fact.
    - Explicit motion-only segments may use a segment-owned synthetic clock.
    - Expected audio failure fails the segment; it never becomes normal no-audio playback.
    - Missing required wiring, invalid payloads, and impossible lifecycle transitions fail visibly.
    - Optional performance curve failure or lateness is recorded as skipped and does not modify the valid base motion.
  data_rules:
    - Motion Lab records raw model output, resolved levels, derived and constrained axes, compiled plans, timing, run identity, and terminal outcome.
    - Runtime facts are persisted asynchronously and do not block the active conversation.
    - Stage diagnostics preserve value sources so final motion remains attributable.

verification:
  policy:
    - Automated tests are limited to the smallest public-boundary input/output smoke checks.
    - Tests are not evidence that the end-to-end interaction is correct.
    - Source tracing, structured runtime logs, Motion Lab records, and a live Electron conversation are the primary evidence.
    - Do not run full regression suites by default and do not add mocks to compensate for missing live verification.
  checks_run:
    - All retained local Markdown links resolve to current files.
    - Deleted-document and full-test-guidance references are absent from README, docs, and AI state.
    - Current ModelEngine stage order in architecture text and Mermaid sources matches compiler/registry.ts.
    - git diff --check reports no whitespace errors.
  validation_gap:
    - A live AstrBot plus Provider plus TTS plus Electron plus Live2D conversation is required to verify prompt construction, effect delivery, atomic segment release, real audio clock, subtitle, lip sync, motion start, parameter writes, and terminal reporting as one chain.
    - Current code still auto-detects common lip-sync parameter names when model3 omits the LipSync group, which conflicts with the documented exact-capability boundary.
    - Current v4 motion-step capability validation checks unknown axis IDs from the first step when building used_axis_ids; later steps require a direct source review before the strict all-step contract can be considered closed.

backlog:
  - id: motion_lab_training_workbench
    status: planned
    summary: Build a separate UI for querying, replaying, reviewing, and curating persisted Motion Lab records.
  - id: speech_performance_quality
    status: active
    summary: Improve non-periodic speech gestures and Live2D physical expressiveness without adding a parallel playback clock.
  - id: remote_operator_plugin_split
    status: deferred
    summary: Move remote computer execution into a separate AstrBot plugin after the server-side AstrBot architecture is stable.
  - id: strict_runtime_residue_cleanup
    status: todo
    summary: Remove current compatibility residue that conflicts with strict model capability ownership.
    notes:
      - Remove Live2D mouth-parameter name auto-detection after every supported model declares its LipSync group.
      - Validate every motion_steps entry against the current profile, not only the first step's axis identity set.
      - Remove legacy semantic-profile migration and old-action wording after active profile files are confirmed current.
