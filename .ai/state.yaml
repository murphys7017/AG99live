task:
  class: bugfix
  risk: medium
  phase: semantic_binding_output_range_validation
  status: implementation_complete
  scope: "Reject zero-width semantic parameter output ranges at the profile editor, backend profile owner, and frontend model-sync boundary before they can compile into frozen dynamics."

context:
  confidence: high
  assumptions:
    - Phase one feature scope remains complete, but this does not imply that the current source is defect-free.
    - Only source-confirmed unresolved defects belong in the active defect register; resolved, invalid, speculative, and historical findings are removed.
    - Performance work must distinguish existing foundations from remaining implementation instead of describing completed capabilities as future work.
    - Remote Operator, VTS recording, small-model training, Physics diagnostics, and productization keep their own boundaries and do not become Performance Director responsibilities.
    - Segment-level output rejection must not close the WebSocket; session-store and connection infrastructure failures remain fatal.
    - The existing MotionLab outbound queue is the only persistence path for frontend rejection diagnostics.
    - A rejected atomic segment is a settled SessionStore fact: none of its individual materials are released, but it still participates in synth_finished and failed playback acknowledgement.
    - Frontend sessions retain only recent terminal history, and the backend terminal idempotency ledger retains at most 256 completed turns per connection.
    - Pending motion identity is the normalized Turn/Message pair, and duplicate delivery is not replacement semantics.
    - Rejecting a later duplicate must not mutate, fail, or resynchronize the first pending payload.
    - The existing PlaybackTimeline sink remains the lifecycle owner; this fix must not add a queue, dedupe layer, or fallback.
    - ModelEngine timing compilation owns blend and hold budgets; WebSDK consumes the validated result and must not invent a second timing policy.
    - The minimum legal motion duration is 320 ms, so the existing 80 ms entry and 120 ms release leave at least 120 ms for idle hold.
    - A semantic parameter binding output range is meaningful only when minimum is strictly less than maximum; inversion remains represented by the existing invert field.
    - Profile validation owns this invariant. ModelEngine must not become a fallback validator for malformed synchronized profiles.

documentation:
  authorities:
    phase_status: docs/01-架构与结构/06-一期完成边界与二期入口.md
    active_defects: docs/02-设计文档/20-端到端链路已确认问题与修复边界.md
    performance_roadmap: docs/02-设计文档/18-二期角色表演系统总体规划.md
    performance_source_audit: docs/02-设计文档/19-角色表演主流程与编排职责审计.md
    remote_operator_boundary: docs/02-设计文档/07-远程执行器接入设计.md
    training_and_vts_boundary: docs/05-小模型训练/01-动作小模型训练前置条件与职责边界.md
  rules:
    - README and diagram indexes may summarize and link, but do not own phase, defect, or next-step lists.
    - Fixed defects are deleted from the active register after source review; they are not retained as history.
    - Source audit documents describe current ownership and completed migrations, not a second roadmap.

verification:
  policy:
    - Use source tracing, type/static checks, git diff review, and the smallest available boundary smoke check.
    - Automated tests are low-confidence input/output smoke checks; do not run the full suite.
    - Live AstrBot, Electron, TTS, and Live2D behavior remains user-led runtime acceptance.
  current:
    - Backend profile normalization now requires every parameter binding output range to have a strictly positive span while preserving non-decreasing axis and input ranges.
    - Profile Editor applies the same rule before save, and the frontend model-sync parser rejects a malformed synchronized profile before ModelEngine can consume it.
    - ModelEngine and WebSDK were not changed; they continue to consume profiles that already satisfy the profile contract.
    - The focused output-range smoke check passed for one valid range, one permitted non-binding zero-width range, and one rejected zero-width binding range.
    - `python -m py_compile astrbot_plugin_ag99live_adapter/live2d/semantic_axis_profile.py` passed.
    - `npm run typecheck:renderer` passed from `frontend`.
    - `git diff --check` passed.
    - Live Profile Editor save and model-sync rejection remain pending user runtime acceptance.
