task:
  class: feature
  risk: medium
  phase: implemented
  scope: Abstract legacy Mk6 motion/expression assets into semantic-axis prompt templates
context:
  confidence: medium
  assumptions:
    - Mk6 first-version motion axis design treats head/body/eye-open/eye-smile/gaze axes as action primary axes.
    - Mouth smile, mouth X, and brow detail axes are expression/detail hint axes.
    - Mouth open and breath should remain runtime/ambient-owned by default and should not be emphasized in realtime motion prompts.
    - BodyAngleY is the preferred first-version binding for `body_pitch`; PhyBodyPositionY remains observation material.
    - Existing generated semantic profiles should auto-migrate to the current default design even when model source hash is unchanged.
    - User-modified semantic profiles should not be overwritten by default; when a stale profile already matches the current model hash and only needs old-default-design migration, it can auto-refresh to the latest default design, otherwise it remains stale for manual review.
    - Legacy motion `key_axes` references in tests remain as rejection coverage, and `adaptive_parameter_profile.v1.key_axes` remains a scanner schema field outside this migration.
    - AstrBot interaction middleware is the default motion prompt path; inline `<@anim>` prompt injection is retained only as an explicit compatibility mode.
    - The current adjustment should make body_yaw/body_roll/body_pitch more visible through prompt language, default few-shot anchors, and generated head-to-body coupling, without raising global motion intensity.
    - Motion intent/plan parameter-level faults should preserve usable axes/parameters where the schema/profile/timing contract is otherwise valid, so Action Lab history can still capture playable partial motions.
    - Legacy exp3 expressions should be reused as semantic-axis expression reference material, but legacy motion3 curves should not be abstracted into generated axis examples because that can bias the model toward oscillatory output.
    - Existing motion3 files from motion_catalog.json should be exposed as selectable catalog animations; when none fit, the LLM should generate a single-frame semantic pose target instead of a motion3-style animation curve.
    - Prompt size is not the main constraint for this workflow, so all valuable mapped motion/expression templates can be included after filtering non-semantic parameters.
    - Pure expression switches can inform emotion_label and intent selection, but must not be represented as output axes unless they map to current SemanticAxisProfile prompt axes.
    - Built-in fixed selector few-shot examples should be fallback material only when legacy reference templates are unavailable, unless explicitly re-enabled by config.
  unresolved_questions:
    - Body pitch and brow detail axes still need real Mk6 visual preview before treating their default ranges as final.
architecture:
  stability: evolving
  boundary_changes:
    - Live2D scanner standard channels now include `body_pitch`, `brow_left_detail`, and `brow_right_detail`.
    - Default generated SemanticAxisProfile now exposes the first-version motion primary axes and hint/runtime roles described in the motion-axis design docs.
    - ensure_semantic_axis_profile now detects old generated default designs under the same source hash and rebuilds backend-owned profiles; stale user-modified profiles that already match the current hash can also refresh through the old-default-design migration path, while the remaining user-modified mismatches stay stale.
    - Frontend direct parameter axis typing/constants now include the expanded axis set.
    - Realtime motion prompt and default examples now prefer action skeleton axes before expression detail axes.
    - Runtime motion ingress/egress logs now report semantic `axis_count` instead of legacy `key_axes_count`.
    - Default `motion_generation_mode` is `split_after_reply` / middleware-first; `inline_first` remains available as a compatibility path.
    - Default generated SemanticAxisProfile head-to-body couplings now use stronger body follow-through for yaw and roll.
    - Default realtime motion prompt/examples now treat visible body yaw/roll/pitch as part of the action skeleton for explicit emotion and posture, not only small follow-through.
    - Middleware motion prompt capability now includes per-axis semantics, value ranges, neutral values, and usage notes for prompt-visible axes.
    - Frontend ModelEngine and Live2D direct plan startup now salvage valid axes/parameters from partially invalid payloads instead of failing the entire motion when possible.
    - Frontend semantic parameter playback adds bounded secondary life motion for head/body/gaze axes so a plan does not hold a perfectly static target through the whole duration.
    - Middleware and fallback realtime motion prompts now include filtered legacy expression reference templates built from SemanticAxisProfile parameter bindings.
    - Middleware and fallback realtime motion prompts now expose motion_catalog options as complete reusable motion3 animations via `choice=catalog`; generated semantic-axis output is explicitly a single-frame pose target via `choice=generate`.
    - Frontend and adapter protocol now accept `engine.catalog_motion` / `engine.catalog_motion.v1` payloads and play them through the existing Live2D `startMotion(group,index,priority)` runtime path.
    - Live2D motion scan payload now keeps catalog description, emotion bias, recommended scenarios, and exclusivity metadata for prompt template abstraction.
    - Fallback realtime motion selector no longer injects built-in fixed few-shot examples when legacy motion/expression reference templates are available by default.
