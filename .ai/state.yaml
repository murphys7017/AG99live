native_runtime_architecture_redesign_20261112:
  date: '2026-11-12'
  class: architecture
  risk: high
  status: architecture_migration_complete_pending_live_acceptance
  decision: Stop adding Native capabilities directly to render-core/src/main.cpp. The target architecture separates runtime-core
    protocol parsing, NativeRuntimeCoordinator, SettingsController, pure MotionCompiler and MotionScheduler, ParameterMixer,
    NativeModel, AudioRuntime and NativeHost. The render thread owns Cubism state; the audio worker owns waveOut and the audio
    clock; the network thread only produces typed events. Adapter remains the sole persistent desktop-settings owner.
  scope: Add the overall C++ architecture proposal and migration order. Phase 1 extracts the settings controller, and Phase
    2 moves the runtime coordinator implementation out of main.cpp behind typed callbacks and services, Phase 3 separates
    the motion compiler after golden samples, and later phases split audio and host. No algorithm rewrite, second Adapter
    client, second playback clock, or immediate broad refactor is included.
  validation: Proposal and phase status are recorded in docs/02-设计文档/16-C++原生运行时整体架构重设计.md and indexed from docs/README.md.
    Phase 1 adds render-core/include/ag99/native/settings_controller.hpp and its source, moves Native setting parsing/range/format
    logic out of NativeModel, and preserves the existing Release build and protocol behavior. Phase 2 adds render-core/include/ag99/native/runtime_coordinator.hpp
    with shared segment-clock/terminal types, a single callback contract, and typed RuntimeCoordinatorServices. The in-process
    RuntimeBridge boundary is now NativeRuntimeCoordinator, implemented in render-core/src/native_runtime_coordinator.cpp.
    WinMM microphone capture and PCM uplink live in MicrophoneCapture, complete WAV and OLV PCM waveOut sinks live in audio_runtime.cpp,
    and the typed Turn/Segment/OLV playback ledger lives in playback_ledger.hpp. Phase 3 moves motion plan types to motion_types.hpp,
    JSON validation helpers to json_utils.cpp, track-point and axis relation-graph parsing to motion_compiler.cpp, and bounded
    / spring scheduling math to motion_scheduler.cpp. Track time evaluation and active/pending/terminal motion lifecycle are
    in motion_scheduler.hpp/cpp; CompileMotionPlan and ParseParameterPlan are in motion_compiler.cpp with typed contexts;
    NativeModel only supplies the profile, intensity snapshot, parameter descriptors, and Cubism writes. Audio clock, RMS,
    speech signal, playback lifecycle, PCM queues, playback ack queue, and current audio identity now live in AudioRuntime.
    NativeHost owns main-window creation, Win32 window procedure, tray menu, input controls, and input window message posting.
    NativeModel/Cubism model ownership now lives in native_model.cpp with typed services. main.cpp is reduced to startup,
    D3D surface, and message-loop assembly. Release build, all three CTest smoke targets, diff checks, frontend typecheck,
    and the ten focused Adapter runtime tests pass.
  remaining: Code-level architecture migration is complete. Remaining evidence gaps are live Web-to-Native reconnect, motion
    golden samples, visible model output, audio-device timing, interruption, and reconnect acceptance.
