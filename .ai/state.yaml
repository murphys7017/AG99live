    versus whole rendering was identical for 512/1000/2048-sample chunks.
    Production runtime loaded into hidden Electron yielded a 32000 Hz PCM
    session and disposed cleanly. Renderer typecheck passed.
  acceptance: >-
    User confirmed the audible playback issue is fixed in actual use on
    2026-10-18 and requested committing this scoped fix.
  evidence_gap: >-
