task:
  class: bugfix
  risk: high
  phase: strict_motion_error_propagation
  status: complete
  scope: Remove motion-path fallback behavior, make model readiness authoritative, and preserve failed sink outcomes without false release state
context:
  confidence: high
  assumptions:
    - Playback acknowledgement is recorded only after the outbound WebSocket send succeeds; send failure makes the frontend session fail visibly.
    - Disconnect and turn replacement interrupt every owned Timeline with explicit turn_id plus message_id; ModelEngine stops only the matching active run and removes only that segment's pending payload.
    - Soft handoff keeps the previous run owned until the replacement starts; expression lookup failure preserves both the previous run and expression, while direct-plan replacement failure explicitly settles the previous run.
    - Production Orchestrator, Timeline, and pending motion keys require non-empty turn_id and message_id; preview remains a separate direct path.
    - Main-path lip sync uses only the current HTMLAudioElement Web Audio clock; SDK WAV progression is not a fallback clock.
    - ModelEngine compile failures are persisted as Motion Lab feedback events; frontend events are written to IndexedDB before send, retained until a SQLite persistence acknowledgement, and resent with a stable event_id after reconnect.
    - A preparing audio PlaybackTimeline remains the lifecycle owner of its queued motion even though it cannot be used as a timing clock until audio starts.
    - A motion player may report accepted playback only when it synchronously invokes onStarted with a non-empty runId; ModelEngine no longer synthesizes unowned started events.
    - Motion intents whose profile_revision differs from the selected model profile fail compilation instead of being reinterpreted with current anchors and relations.
    - Resource candidate identity is the pair resource_type plus case-insensitive resource_id, so expression and motion layers may intentionally share a catalog ID.
    - Persona Effect resource intent is split into expression_resource_id and motion_resource_id; legacy resource_id is rejected on the v4 main path while the official <@anim> v3 compatibility contract remains unchanged.
    - Expression resources may layer with a semantic parameter plan only when parameter ownership does not conflict; motion resources are complete-action playback and replace the parameter plan at execution time.
    - Invalid, ambiguous, unowned, or non-playable resource intents fail visibly and never fall back to axis-only playback.
    - New unified-clock and protocol work should not preserve legacy playback or motion routes for compatibility; old routes should be deleted or made fail-visible instead of silently falling back.
    - Backend control events that settle or interrupt a turn must carry explicit turn_id; the frontend must not infer turn ownership from currentTurnId or active audio state.
    - Phase 1 pure timeline logic is complete; Phase 2 now lets audioRuntime create a segment PlaybackTimelineEngine for released audio.
    - Audio timeline integration observes and records real audio playback clock state, but does not yet replace turnPlaybackOrchestrator release decisions.
    - Audio playback is now injected through PlaybackTimelineAudioSink instead of separate start/stop/clock functions, making audio execution a concrete timeline sink boundary.
    - PlaybackTimelineRuntime stores timelines only by turnId + messageId; active timeline compatibility APIs and the hidden active segment pointer have been removed.
    - ModelEngine now consumes handlePlaybackTimelineStarted(PlaybackTimelineSnapshot) as the audio-start motion wakeup entry point; the old notifyAudioPlaybackStarted bridge has been removed.
    - Motion release now receives a segment-scoped audio timeline snapshot from PlaybackTimelineRuntime when turnId and messageId match; mismatched timeline snapshots are intentionally hidden from the motion sink.
    - Audio-start delayed motion wakeup now lives in PlaybackTimeline AudioStartMotionTimelineBridge and refreshes the segment-scoped playback timeline snapshot at timer fire time, so ModelEngine does not consume stale currentTimeMs.
    - Motion release now registers a required motion sink on the matched active audio timeline; ModelEngine started/finished callbacks write motion started/completed/failed/interrupted terminal state back into that timeline.
    - Active audio timelines are retained after audio completion when a required motion sink is still running, and are cleared only after the timeline reaches completed/failed/interrupted.
    - Active playback timeline lifecycle has been extracted from AdapterAudioRuntime into PlaybackTimelineRuntime; AdapterAudioRuntime now delegates audio timeline, motion-only timeline, and motion/lip-sync sink terminal updates.
    - TurnPlaybackOrchestratorCore now emits a typed segment release job with explicit text/audio/motion slots instead of separately owning text/audio/motion release calls; PlaybackTimelineRuntime owns that job's execution semantics while turn-playback only forwards the job.
    - Segment job execution semantics now live inside PlaybackTimelineRuntime.startSegmentJob; useTurnPlaybackOrchestrator forwards segment jobs directly into the timeline runtime, while segmentJob defines job/sink contracts.
    - PlaybackTimelineRuntime now exposes startSegmentJob as the segment-level start entry point; text/audio/motion/session execution ports are configured on the runtime first, and missing ports are a hard wiring error.
    - Queued text/audio segment release logic now lives in playback-timeline/segmentReleaseSinks, with pending playback queue helpers moved to playback-timeline/playbackReleaseQueue; adapter code supplies pending queues and side-effect callbacks while the timeline segment executor calls timeline-owned sinks.
    - PlaybackTimelineRuntime no longer exposes segment, motion, or audio preparation APIs publicly; motion timeline preparation is owned by startSegmentJob, while audio preparation is private behind startAudioTimelineSink.
    - Playback timeline runtime wiring is no longer optional for segment release; missing timelineRuntime is a type-level wiring error instead of a silent preparation bypass.
    - AudioPlaybackActions and MotionSink timeline wiring are now required dependencies, so missing audio timeline callbacks or motion timeline lookup/terminal callbacks are type-level wiring errors instead of silent timeline bypasses; motion preparation is not exposed through adapter-facing ports.
    - PreviewMotionPlayer now reports stopped terminal events for explicit motion stops and direct-plan replacement, so motion timeline sinks do not depend on silent local cleanup.
    - Explicit no-audio motion-only segments create a synthetic playback timeline with motion as the required sink.
    - Motion-only synthetic timelines now require an explicit release context marked as no-audio; a missing audio timeline is not enough to create synthetic timing.
    - Explicit motion-only contexts fail immediately with motion_only_timeline_unavailable when a synthetic timeline cannot be prepared; they must not queue in ModelEngine waiting for an audio-start timeout.
    - ModelEngine now uses playback timeline duration/currentTime as the only audio-synced motion timing source when the release context carries a usable timeline snapshot.
    - Performance curve timing now resolves through a playback-timeline curve resolver; valid audio timelines use remaining duration, explicit synthetic timelines may be used only with duration, and audio_unavailable/missing-duration timelines skip the curve with diagnostics instead of being treated as synced timing.
    - Audio-start notifications now refresh pending motion entries with the current matched audio timeline snapshot before starting the payload, avoiding stale release-time timeline snapshots.
    - Speech-only motion now also consumes the matched audio-start timeline snapshot when no queued motion starts, so speech-following plans use real remaining audio duration instead of any SessionStore estimate.
    - Motion release timeline ownership lookup now lives in PlaybackTimelineRuntime; TurnPlaybackOrchestrator no longer reads active audio timeline snapshots directly, and MotionTimelineSink uses segment-scoped lookup when available.
    - Lip sync runtime has been moved behind an independent PlaybackTimelineAudioLipSyncSink boundary, and PlaybackTimelineAudioSegmentSink now owns audio element event ordering plus lip-sync attach/start/terminal/stop while audio playback actions only update adapter/session state.
    - Audio segment runner now starts browser audio through PlaybackTimelineRuntime.startAudioTimelineSink, so released audio enters the PlaybackTimelineEngine sink-start callback path instead of runner-local prepare plus direct sink start.
    - AdapterAudioRuntime now separates direct adapter audio release from timeline job queue consumption: direct release marks SessionStore audio.released itself, while timeline segment jobs consume queued audio through a raw queue-release port and let PlaybackTimelineRuntime mark audio.released once.
    - AdapterConnection.playbackTimeline no longer exposes direct text/audio queue release wrappers or raw segment-sink wiring; connection-level callers and tests should release playback through PlaybackTimelineRuntime.startSegmentJob with explicit text/audio/motion slots.
    - AdapterAudioRuntime now hides the raw queued-audio consumer behind configureSegmentExecution, so adapter-facing wiring can provide session/text/motion ports without exposing queue consumption outside the audio runtime facade.
    - Audio playback started/duration and active-timeline terminal SessionStore writes now happen through PlaybackTimelineRuntime audio lifecycle session ports; AdapterAudioRuntime's state bridge updates UI playback state for those events.
    - Motion playback started/terminal SessionStore writes now happen through PlaybackTimelineRuntime motion lifecycle session ports; PlaybackCompletionCoordinator now owns only turn-level playback_finished acknowledgement and late-audio reopen.
    - Production desktop wiring uses the independent MotionPlaybackRecorder for motion history, run tracking, and Motion Lab raw events; PlaybackCompletionCoordinator has no motion-recording dependency.
    - Live2D lip-sync sampling and external mouth-parameter writes now live in frontend/src/live2d/lipSyncTimelineSink.ts; playback-timeline/lipSyncSink.ts keeps only the timeline-facing lifecycle runtime and terminal rules.
    - Playback timeline sink terminal state is now stable once a sink reaches a terminal value, so late cleanup/completion events cannot overwrite a real failure.
    - Missing required playback timeline or sink lifecycle wiring should mark the affected audio/motion segment failed instead of being treated as a warning-only event; late events after a closed timeline may remain diagnostic-only.
    - Lip sync can only complete after it has explicitly started; if audio ends before lip sync starts, the lip_sync sink fails with lip_sync_not_started_before_audio_end.
    - Lip-sync resource disposal is distinct from business interruption: normal audio element disposal does not emit interrupted, while replacement or explicit stop does.
    - Timeline snapshots now expose audio_unavailable when an attached or expected audio clock cannot provide a playable audio-time snapshot, keeping text-only synthetic timing separate from audio-clock failures.
    - Audio playback started events require a real audio clock; missing clock at started time fails the audio sink/session instead of installing a synthetic or unavailable playback clock.
    - ModelEngine no longer consumes audio_unavailable playback timelines for audio-synced duration or speech-active detection, and it will not fall back to SessionStore audio-duration estimates for that failure state.
    - Stopping an already-playing audio segment now writes an audio terminal only when no more specific terminal reason has already been set.
    - The automatic Persona Effect motion path uses engine.motion_intent.v4 axis_levels exclusively; engine.motion_intent.v3 axes remain only for the official <@anim> compatibility transport and internal manual previews.
    - Persona Effect v4 never falls back to v3: mixed axes/axis_levels, non-integer levels, out-of-range levels, unknown axes, or missing profile anchors fail visibly.
    - Semantic profiles persist ordered -3..3 level anchors; ModelEngine converts levels from those anchors and records raw levels plus resolved axes in MotionTransformTrace before relation-graph processing.
    - Non-neutral axis levels are deterministically sampled inside the selected level's midpoint bounds using turn_id, message_id, profile hash, and transform version; intensity scaling cannot cross those recorded sample bounds.
    - Semantic pose and speech following share one parameter owner: ModelEngine attaches speech following as modulation on the compiled semantic parameter instead of rejecting overlap or creating a second writer.
    - Semantic axis profiles own max velocity, max acceleration, life-motion scale, and maximum speech-offset ratio; PlanBuilder maps these values into Cubism parameter space and WebSDK limits the final per-frame target after all modulation and easing are composed.
    - Per-frame dynamics decelerate continuously across target reversals and stop exactly at the target when a discrete frame would cross it, preventing target-adjacent oscillation.
    - Exceptions during an active direct parameter plan are owned by that motion run: WebSDK reports a failed terminal and keeps RAF alive; render failures without an active plan remain fail-visible.
    - Direct parameter plan terminal timeout actively stops the SDK plan with a failed terminal instead of leaving a hidden active run after updating UI state.
    - Live2D renderer readiness is emitted only after the active model reaches Cubism CompleteSetup; Vue nextTick is not a model-ready signal.
    - Concurrent calls for the same model initialization share one load Promise, while model selection requests are serialized before changing the SDK global model configuration.
    - A rejected motion sink is handled once as failed and is never recorded as released or retried by the orchestrator.
    - WebSDK parameter binding, lip-sync parameter selection, and voice-following frequency/direction use explicit profile declarations only; runtime name guessing has been removed.
    - Parameter plan source, neutral target, and dynamics are mandatory at parser and SDK boundaries and are not defaulted during playback.
    - WebSDK rejects an entire malformed, unbindable, duplicate, or out-of-range parameter plan instead of salvaging playable entries or clamping invalid plan targets.
    - Every engine.parameter_plan.v2 parameter requires neutral_target_value and dynamics; Motion Lab manual plans derive both from the selected semantic axis profile rather than emitting an unconstrained legacy plan.
    - Multi-step motion validates neutral-to-first and inter-step travel against rest-to-rest triangular/trapezoidal velocity profiles; impossible timing fails with motion_sequence_transition_budget_exceeded.
    - Motion relation diagnostics record within_limit, derived, constrained, and skipped outcomes independently from actual value-changing adjustments; stabilization passes do not overwrite an earlier derived or constrained outcome.
    - The unused RealtimeMotionPlan generator, its dedicated tests, hidden realtime selector settings, and SDK WAV lip-sync analyzer have been removed; the Persona Effect path and official <@anim> compatibility path remain the only automatic motion inputs.
    - The automatic motion path is middleware-first only; inline_first is no longer a runtime-selectable motion generation route.
    - engine.motion_intent.v2 is no longer accepted at backend normalization, frontend inbound, preview send, or ModelEngine normalization boundaries.
    - <@anim> remains an official AstrBot compatibility transport only when Persona Effect injection is unavailable; it is not a fallback for invalid ag99live.motion payloads.
    - motion_catalog.json may enrich fallback pose descriptions and catalog-derived semantic candidates only when the motion can be mapped to semantic axes.
    - fallback_pose_id is no longer selected as a semantic pose; it remains empty in the transitional v3 shape and never drives playback.
    - The unused middleware helper that selected the first fallback pose candidate has been removed; candidate ordering remains prompt-only.
    - Motion prompt static/dynamic scope metadata improves render-tree selection and diagnostics, but model input token reduction still depends on AstrBot/provider static prefix caching or session-level reuse.
    - Main Persona Effect motion no longer performs backend skeleton repair or fallback pose replacement; remaining fallback candidate data is prompt/diagnostic metadata until an explicit Engine-stage policy is implemented.
    - Empty, invalid, or all-neutral motion axes should not be replaced by a fallback pose; those turns should be treated as no valid motion input.
    - AdapterConnection now exposes playback timeline operations through the aggregated playbackTimeline port; production callers should not depend on scattered root-level timeline methods.
    - PetDesktopRuntime now delegates playback timeline motion wiring and segment execution wiring to app-level helpers, keeping the desktop runtime from owning bridge details directly.
    - Semantic motion processing lives in ModelEngine: the adapter validates and transports semantic intent without semantic clamping, fallback pose repair, expressive floor, or head/body constraint rewriting.
    - ModelEngine now rejects invalid axes and exact-neutral semantic inputs with structured compile feedback, then applies the mounted semantic axis relation graph before plan building.
    - TurnCoordinator validates and transports Persona Effect v4 payloads plus official <@anim> v3 compatibility payloads; it does not apply semantic axis constraints.
    - Semantic profiles now carry ag99.semantic_axis_relation_graph.v1 edges; derive and bounded_ratio rules are consumed by ModelEngine, while old couplings are only a migration source for profiles that have not been rewritten yet.
    - Legacy backend fallback-pose scoring and fallback-axis descriptor helpers are removed from the motion intent path; fallback candidates remain prompt/diagnostic metadata only.
    - IntensityStage now produces candidate axis values only; SemanticAxisRelationGraphStage owns final semantic axis value-range constraints and records range adjustments in the transform trace.
    - ModelEngine PlanBuilder now rejects invalid parameter bindings, binding input-range mismatches, and duplicate parameter targets instead of skipping them or reporting after_salvage success.
    - ensure_semantic_axis_profile persists the derived relation_graph for legacy profiles on first load without changing user axes, couplings, status, or revision.
    - Frontend ModelEngine requires semantic profile relation_graph and no longer reads legacy couplings; backend legacy normalization exists only to migrate persisted profiles before they cross the frontend boundary.
    - The unused hash-based speech-pose direction fallback has been removed; speech pose direction now comes from explicit voice-following metadata or axis semantics.
    - Legacy repair/fallback counters in motion_intent.py had no callers and have been removed; runtime failures remain visible through structured payload and compiler diagnostics.
    - Performance curve enum normalization is strict at backend and frontend motion boundaries; invalid curve objects are rejected instead of being rewritten to defaults or silently dropped.
    - A present performance curve hint must be resolvable against the segment PlaybackTimeline; ModelEngine now fails that motion segment when the required timeline/clock data is unavailable instead of deleting the hint and continuing with fallback timing.
    - fallback_pose_id has been removed from the current v3 runtime payload, frontend protocol type, manual preview builders, and diagnostics; old-field fixtures remain only in rejection-boundary tests.
    - Motion generation metadata now uses single_response_effect; immediate/final remains a response-segment phase distinction and is not used as a generation mode.
    - Explicit duration_hint_ms values are now strict at backend motion boundaries: missing remains optional/defaulted, numeric text is accepted, but non-numeric, non-finite, and out-of-range values fail instead of being defaulted or clamped.
    - Empty intent_tags no longer derive the synthetic emotion label "motion"; label derivation now fails visibly and callers must validate tags before building a payload.
    - ModelEngine now preserves validated resource_id on engine.parameter_plan.v2 and MotionTransformTrace without triggering catalog or expression playback; resource playback remains reserved for an explicit asset policy and timeline sink.
    - Voice-following direct parameters now fail compilation when they target a parameter already owned by a semantic or derived axis; the previous silent skip is no longer allowed.
    - MotionTransformTrace now records the semantic transform version plus profile revision/source hash, so Motion Lab can distinguish results produced by different relation-graph profile versions.
    - ModelEngine resourcePolicy stage now rejects unknown or unexposed resource IDs, missing resource parameter ownership, and resource/parameter-plan conflicts; it records resource metadata but does not start resource playback.
    - Motion visibility summaries no longer carry fallback/repair result fields; axis descriptors remain diagnostics, while fallback pose candidates remain isolated to Prompt reference data.
    - Backend effect normalization now rejects an invalid resource_id instead of clearing it and broadcasting the remaining semantic axes.
    - Persona Effect motion arguments containing legacy catalog/motion wrapper fields now fail with forbidden_fields instead of being stripped and continued; <@anim> remains the separate official compatibility parser.
    - One ag99live.motion Persona Effect may carry either axis_levels or 2-4 ordered motion_steps; the two shapes are exclusive, every step uses the same axis set, and motion_steps cannot be combined with a complete motion resource.
    - ModelEngine compiles motion_steps into one engine.parameter_plan.v2 with per-parameter keyframes, so the sequence remains one unified-clock run instead of multiple independently scheduled motions.
    - Semantic level sampling uses the stable identity turn_id plus message_id plus profile source_hash plus semantic_motion_transform.v2; level zero remains exact neutral and nonzero levels receive bounded deterministic shared and per-axis variation.
    - Missing sampling identity or profile source_hash is a visible v4 compile failure; no random seed fallback is synthesized.
  unresolved_questions:
    - Runtime validation still needs a fresh AstrBot + Electron run to confirm detail-only MiniMax outputs are repaired into visible motion.
    - Plan frontend execution feedback loop for motion prompts: record resolvedMode and expressive_intent_resolved_to_idle_deadzone outcomes, then use those results to tune motion prompt examples and candidate selection.
    - For earlier curve generation during actual TTS synthesis, identify an AstrBot hook before message-chain Record creation; current MVP starts from emit_message_chain and never blocks playback.
    - Lip-sync remains an optional timeline sink; PlaybackTimelineEngine interrupt now supplies its interrupted terminal state, while the Live2D boundary remains responsible for sampling and parameter writes.
architecture:
  stability: evolving
  boundary_changes:
    - Legacy playback/motion compatibility paths are not part of the target architecture; migration work should converge on one strict route rather than keeping old alternate chains alive.
    - Inbound control.turn_finished, control.synth_finished, and control.interrupt now reject missing turn_id at protocol mapping instead of falling back to current or active audio turn identity.
    - Frontend now has a new playback-timeline module that defines a reusable segment timeline contract, synthetic/audio clock abstraction, and sink terminal state machine without yet changing real playback integration.
    - Audio runtime now creates a segment-scoped playback timeline for each released audio segment, attaches the HTMLAudioElement playback clock on playback start, and clears only that segment timeline on completion, failure, or interruption.
    - AdapterAudioRuntime depends on PlaybackTimelineAudioSink for audio start/stop/clock access, while the browser HTMLAudioElement implementation now lives inside playback-timeline/audioSink.ts behind createBrowserAudioTimelineSink.
    - TurnPlaybackOrchestrator now releases audio before motion for the same ready segment so audioRuntime can create an active timeline before ModelEngine ingests the motion payload.
    - Segment playback release is now a dedicated playback-timeline runtime boundary; motion release requires a valid receivedAtMs and fails visibly instead of substituting a local fallback timestamp.
    - Segment release side effects are now isolated behind PlaybackTimelineRuntime.startSegmentJob; useTurnPlaybackOrchestrator submits typed segment jobs and no longer routes through a turn-playback compatibility adapter.
    - The obsolete turn-playback/segmentPlaybackRelease forwarding layer has been removed; useTurnPlaybackOrchestrator invokes PlaybackTimelineRuntime.startSegmentJob(job) without carrying sink implementations, moving the public segment execution entry and execution-port ownership to the timeline runtime while preserving existing sink behavior.
    - PlaybackTimelineRuntime is now the segment job execution boundary; it still invokes configured text/audio/motion execution ports during migration, but owns the release context shape such as explicit motion_only timeline mode.
    - PlaybackTimelineRuntime asks itself to prepare audio+motion or explicit motion-only segment timelines before motion execution; motion-only preparation failure is marked as motion_only_timeline_unavailable instead of being hidden by ModelEngine ingestion.
    - PlaybackTimelineRuntime and useTurnPlaybackOrchestrator now require the timeline runtime start/preparation boundary so segment release cannot silently skip unified timeline preparation.
    - PlaybackTimelineRuntime.prepareAudioTimeline is idempotent for the same active audio segment so segment-level preparation cannot wipe an already registered motion sink when audio playback also prepares the same timeline.
    - PlaybackTimelineRuntime.startAudioTimelineSink is now the audio sink start boundary used by both segment jobs and the audio segment runner; audio runner no longer starts browser audio outside the engine sink callback path.
    - AudioPlaybackActions now requires timeline lifecycle callbacks for audio duration, started, terminal, lip-sync terminal, and active timeline stop; MotionSink now requires segment-scoped timeline lookup plus audio/motion-only prepare callbacks.
    - AdapterConnection no longer exposes getActiveAudioTimelineSnapshot publicly; upper layers use segment-scoped timeline lookup instead.
    - A new PlaybackTimelineMotionSink wraps ModelEngine motion start and attaches only same turnId/messageId timeline snapshots supplied by PlaybackTimelineRuntime to motion contexts.
    - PlaybackTimelineMotionSink now prepares a required motion sink on matched audio timelines and marks it failed when ModelEngine rejects the motion payload before playback starts.
    - PreviewMotionPlayer catalog motion playback now exposes started/terminal callbacks with runId, allowing catalog motions to participate in motion timeline terminal tracking.
    - Catalog motion terminal state now comes from the Live2D SDK callback; the preview player no longer completes it from duration metadata, and catalog playback requires an explicit stopMotion runtime capability for interruption ownership.
    - PreviewMotionPlayer stores the active terminal callback and emits a single stopped terminal when playback is explicitly stopped before the Live2D runtime reports completion.
    - AdapterAudioRuntime exposes a motion-only timeline preparation path so no-audio motion segments can still run under PlaybackTimelineEngine with a synthetic clock.
    - PlaybackTimelineRuntime owns segment-scoped timelines during migration; AdapterAudioRuntime remains the outer playback compatibility facade.
    - PlaybackTimelineLipSyncRuntime now owns lip-sync started/unavailable/completed/failed settlement, and PlaybackTimelineRuntime starts the optional lip_sync sink after audio playback starts; AudioSink no longer carries the lip-sync terminal state machine directly.
    - The Live2D lip-sync timeline sink uses the current HTMLAudioElement WebAudio RMS sampling, external Live2D lip sync writes, and cleanup; no SDK WAV preload/progression path runs in parallel.
    - Motion Lab backend persistence is idempotent by event_id; system.motion_lab_raw_event_recorded is emitted only after the SQLite insert call completes, and WebSocket send success alone never settles the frontend pending record.
    - PlaybackTimelineEngine ignores late started/terminal events for sinks that are already completed, failed, absent, or interrupted.
    - During early development, fallback behavior should be fail-visible: optional sinks may fail without blocking required playback, but missing capabilities must not be silently reported as started or completed.
    - TimelineClock uses synthetic clock only for explicit no-audio timing; attached audio clock failures are exposed as audio_unavailable rather than hidden behind synthetic.
    - PlaybackTimeline snapshots with clockSource=audio_unavailable are diagnostic failure contexts, not usable timing sources for motion compilation or speech-following.
    - Performance curve hints are consumed only after the current playback timeline proves a usable duration; skipped curves remain visible as `performance_curve_skipped:*` compiler diagnostics.
    - AdapterConnection exposes setAudioTimelineStartedHandler so PetDesktopRuntime can drive ModelEngine motion wakeup from the real audio timeline started event instead of CompletionCoordinator session watching.
    - Frontend motion ingest context can carry an optional playbackTimeline snapshot; ModelEngine pending scheduler preserves it and motionStart uses only usable timeline timing, failing pending audio-synced motion when no matching timeline arrives.
    - Pending audio-synced motion failures now also mark the attached playback timeline motion sink failed, so required sinks do not remain idle after scheduler rejection.
    - ModelEngine pending motion entries refresh their playbackTimeline from the AdapterAudioRuntime audio timeline started event when a same turnId/messageId audio timeline is available.
    - ModelEngine speech-only audio-start path now receives a same turnId/messageId playbackTimeline snapshot from the audio timeline started bridge, keeping speech-only timing on the same timeline contract as queued motion.
    - ModelEngine requires injected timeline-terminal reporting and speech-only gating dependencies; speech-only motion is suppressed when the same segment already has a failed/released/started/completed formal motion state, preventing it from masking motion timeline failures during development.
    - Generic audio stop cleanup no longer overwrites a more specific terminal reason such as audio_playback_replaced_by_new_input.
    - PlaybackCompletionCoordinator no longer owns timer-based missing-motion settlement; motion absence is established by the protocol queue close path instead of a frontend delay guess.
    - Adapter runtime no longer exposes inline_first / enable_inline_motion_contract configuration; <@anim> inline motion tags are parsed and broadcast only for the official compatibility path when Persona Effect injection is unavailable.
    - Frontend and adapter motion-intent boundaries are now v3-only; v2 nested axes are treated as invalid input instead of being normalized forward.
    - TurnCoordinator sanitizes hidden legacy motion markup from visible text/captions while preserving raw assistant output in Motion Lab records.
    - Performance curve timing adds an optional `performance_curve_hint` to semantic motion intents v3/v4; frontend ModelEngine resolves it into timing plus a validated preset name consumed by the Live2D per-frame easing layer.
    - Performance curve generation uses the current turn chat Provider as an auxiliary call and does not add the curve request to AstrBot chat history.
    - fallback pose candidates can now include semantic metadata from motion catalog entries and key semantic axes derived from motion_resource_pool driver components.
    - middleware motion prompt now names axes as a semantic-axis target group instead of a plain field and exposes fallback candidate descriptions, scenarios, intensity, emotion bias, and key axes.
    - middleware motion prompt examples should use a small set of visible non-neutral axis values and show 2-4 non-default fallback pose candidates selected by axis/pose descriptors rather than coarse emotion labels.
    - plugin_hints JSON parsing now tolerates outer-format issues such as fenced JSON, text-wrapped objects, and trailing commas while preserving strict v3 axis semantics.
    - fallback candidate selection and motion visibility summaries now derive pose descriptors from each axis profile's own neutral and soft_range values instead of assuming a global midpoint of 50.
    - frontend motion diagnostics now surface pose_descriptors, outside_soft_range_axes, and skeleton_groups_present from semantic motion summaries so prompt tuning can be compared against runtime-visible motion coverage.
    - middleware motion prompt now marks the decision contract and capability payload as static, keeps per-turn runtime data dynamic, and keeps configured_generation_mode out of the static capability mapping.
    - middleware-first route disables fallback-pose replacement for unusable motion axes while preserving skeleton repair for otherwise valid axes.
    - AdapterConnection playback timeline controls and audio timeline started subscription are grouped under adapter.playbackTimeline, keeping the unified clock boundary out of the general adapter facade.
    - PlaybackTimeline segment job start semantics live in PlaybackTimelineRuntime, which now owns timeline preparation, segment sink release, sink lifecycle, and terminal state.
    - AdapterAudioRuntime no longer exposes a global active audio timeline snapshot; tests and callers use segment-scoped playback timeline lookup.
    - AdapterAudioRuntime audio queue/release responsibilities are delegated to PlaybackTimelineAudioReleaseController; the old adapter audio queue controller has been removed.
    - AdapterAudioRuntime pending-audio settlement responsibilities are isolated behind an audio settlement controller, so turn/all audio cleanup no longer lives inline in the runtime facade.
    - AdapterAudioBridge has been removed; AdapterAudioRuntime writes adapter audio terminal UI state directly, while PlaybackTimelineRuntime writes active-timeline audio terminal facts and the audio settlement controller owns pending-audio queue queries.
    - Audio playback actions now delegate audio element plus lip-sync lifecycle handling to PlaybackTimelineAudioSegmentSink instead of owning audio element callback ordering or lip-sync runtime/callback wiring inline.
    - Browser HTMLAudioElement playback ownership has moved from adapter-connection/runtime into playback-timeline/audioSink.ts, so adapter runtime no longer owns the raw audio element player.
    - AdapterAudioRuntime no longer exposes playAudioAndAcknowledge as a public method; production and tests enter audio playback through queue/release or segment job paths.
    - PlaybackTimelineAudioSegmentRunner now bridges audio segment duration/started/terminal events into PlaybackTimelineRuntime, so audioPlaybackActions no longer owns audio element event ordering.
    - AudioPlaybackStateBridge no longer writes SessionStore audio.released/audio.started/audio.duration/audio.terminal for active timeline playback; started/duration/terminal facts are recorded by PlaybackTimelineRuntime when audio timeline events arrive, release ownership stays with the direct adapter release wrapper or PlaybackTimelineRuntime.startSegmentJob, and non-timeline pending/missing-audio terminal settlement remains in adapter handling.
    - PlaybackTimelineRuntime now has a motion lifecycle session port for motion.started and motion.terminal events, guarded by open-sink checks so late terminal callbacks cannot rewrite motion SessionStore state after the timeline has settled; production disables the coordinator's duplicate ordinary motion lifecycle writes but keeps coordinator-owned handoff settlement.
    - AdapterPlaybackTimelinePort keeps only segment execution configuration and startSegmentJob; raw queued-audio consumption is private to AdapterAudioRuntime's configured segment execution ports.
    - Audio playback stop now interrupts the explicit turnId + messageId playback segment; missing segment identity is surfaced as an error instead of stopping an arbitrary active timeline.
    - PlaybackTimelineEngine now owns sink start callbacks for audio/motion via startSink; remaining direct-sink migration should move prepare/terminal and SessionStore coordination out of migration-era segment-sink wiring.
    - Audio/lip_sync/motion timeline duration/started/terminal events no longer implicitly register or mutate a missing sink; missing segment timeline or sink wiring is diagnosed and the event is dropped.
    - control.synth_finished marks existing output segments without motion payload as explicit motion.absent; motion and performance-curve patches after synth_finished are rejected.
    - control.synth_finished missing-audio settlement now lives in inbound protocol queue-close handling; AdapterAudioRuntime no longer exposes a missing-audio settlement API or scans all sessions for this case.
    - Target direction: performance curve playback should first support a small preset library of per-frame curve shapes selected by hint, before considering real-time generated custom curves.
    - PlaybackTimeline core no longer imports ModelEngine motion types; pure motion context/sink contracts live in playback-timeline/motionTypes.ts, while the ModelEngine-specific motion sink and run tracker live in playback-integrations/modelEngineMotionSink.ts.
    - PlaybackCompletionCoordinator no longer accepts motionPlayer, schedule, or clearSchedule dependencies and no longer keeps an activeMotionSegments shadow set; it observes SessionStore settlement, records motion playback history, and handles current run handoff only.
    - PlaybackTimeline segment job release ordering now lives in playback-timeline/segmentJobExecutor.ts; PlaybackTimelineRuntime supplies timeline sink operations and keeps direct timeline map/engine ownership.
    - TTS/audio expected timeout is an audio failure, not an explicit no-audio segment; it releases only visible text, marks unreleased motion failed, and blocks late audio/motion from reviving the segment.
    - SemanticAxisRelationGraphStage is the single ModelEngine owner for head/body relation constraints; coupling and speech pose produce candidates before the graph resolves final values.
    - bounded_ratio relation targets are derived and constrained inside SemanticAxisRelationGraphStage; the coupling stage only proposes derive candidates, while speech pose performs a non-mutating future-parameter ownership precheck.
    - Motion compile diagnostics now include MotionFeedback and a raw/resolved/derived/constrained/compiled transform trace for Motion Lab correlation.
    - SemanticAxisProfile relation_graph is preserved by desktop runtime snapshot cloning so restored profiles cannot silently lose relation constraints.
