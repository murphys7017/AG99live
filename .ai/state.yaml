native_runtime_review_followups:
  recorded_at: "2026-10-04"
  class: bugfix
  risk: high
  status: source_complete_pending_live_acceptance
  scope:
    - "Protect WebSocket finalization against close/receive-exit races; disable new callbacks, attempt synchronous receive cancellation, wait at most 1.5 seconds for receive and in-flight callbacks, then detach while shared state retains handles until receive exits; run full close only after receive returns."
    - "Mark microphone stream end as dropped after queue loss or sender failure; finalize the previous stream before a retry replaces its identity, and account for in-flight and queued bytes lost on send failure."
    - "Retire output-segment turns on turn_finished/interrupt, reject segments for unstarted or recently retired turns, and bound active turns, pending segments, committed message IDs, and retired turn IDs."
    - "Validate complete finite PCM RIFF/WAVE chunk structure before playback, require a valid duration and successful PlaySoundW start, and report specific playback failure reasons."
    - "Keep Cubism asset paths wide through file access and decode SDK/model JSON path strings as UTF-8, including texture paths."
    - "Serialize microphone Start/Stop transitions across user toggles, reconnect, transport-close cleanup, and runtime shutdown."
    - "Preserve WinHTTP receive error codes in diagnostics and document callback capture lifetime requirements."
  non_actions:
    - "Do not launch the Native Host, connect to Adapter, or claim live microphone/audio/model-path verification."
    - "Do not modify unrelated frontend/control-panel work already present in the worktree."
  review: >-
    Adapter speech ingress rejects a microphone stream marked dropped, so capture
    queue overflow and failed binary sends now invalidate that stream instead of
    presenting it as complete. Turn assembly now requires control.turn_started
    before accepting output, matching the Adapter's outbound ordering and
    preventing terminal turns from being recreated by late segments. The WAV
    parser matches the Adapter's finite RIFF PCM cache contract. Cubism's SDK
    callback accepts std::string paths; the host treats those resource names as
    UTF-8 and converts to native wide paths before Windows file access. The
    WebSocket finalization is synchronized with external close, and full close
    runs only after Receive returns. Close disables new callbacks and waits a
    bounded time for an in-flight callback; the RuntimeBridge owner separately
    drains its callbacks, while generic callbacks that capture references must
    keep those targets alive until in-flight callbacks finish. Receive errors
    preserve the WinHTTP code.
    Microphone Start/Stop transitions are serialized across UI and transport
    lifecycle paths. A pending synchronous Receive is cancelled when possible; after
    1.5 seconds the worker is detached and its shared state retains the WinHTTP
    handles until Receive exits. A stalled callback can extend close while it
    drains, and an uncancellable silent peer can retain connection resources.
  validation:
    - "`cmake --build render-core/build --config Release --target ag99-render-host --parallel 4` passed after microphone lifecycle serialization."
    - "`cmake --build runtime-core/build --config Release --target ag99-runtime-protocol-smoke --parallel 4` passed."
    - "`ctest --test-dir runtime-core/build -C Release --output-on-failure` passed (1/1)."
    - "`ctest --test-dir render-core/build/runtime-core -C Release --output-on-failure` passed (1/1); replay sample emitted the expected ready segment."
    - "`python -m pytest astrbot_plugin_ag99live_adapter/tests/unit/runtime/test_desktop_settings_broker.py -q` passed (1 passed)."
    - "`npm run typecheck:renderer`, focused `desktopSettingsResponder.test.ts`, and `npm run build:astrbot-page` passed."
    - "`git diff --check` passed; only existing line-ending conversion warnings were emitted."
  evidence_gap:
    - "No live WebSocket shutdown race, microphone toggle/disconnect race, microphone queue overflow/send failure, Adapter audio download/playback, non-ASCII model asset path, or layered-window click-through behavior was exercised."

native_microphone_capture_thread_safety:
  recorded_at: "2026-10-02"
  class: bugfix
  risk: high
  status: source_complete_pending_live_acceptance
  scope:
    - "Move microphone frame transmission off the waveIn driver callback onto a dedicated sender thread, so the driver never blocks on network I/O."
    - "Stop calling Stop() from the driver callback; CloseDevice runs waveInReset, which waits for that callback to drain and previously caused a deadlock plus a use-after-free of the active WAVEHDR."
    - "Serialise Stop, CloseDevice, and the sender join so concurrent stop paths cannot close the same HWAVEIN twice."
    - "Guard the capture queue and stream identity with a dedicated mutex that is never held across a waveIn or websocket call, and make the device handle atomic for the driver callback."
    - "Bound the capture queue and report dropped bytes instead of blocking capture."
  non_actions:
    - "Do not change the binary audio protocol, the stream identifiers, or the tray commands."
    - "Do not start the microphone automatically; control.start_mic remains unhandled."
  review: >-
    Two defects were introduced and corrected during self-review before commit: a
    first version let CloseDevice take a different lock from Stop, which
    serialised nothing, and a second version held stop_mutex_ across the sender
    join while the sender needed that same lock, which deadlocked. The final
    shape releases stop_mutex_ before joining and serialises joins separately.
  validation:
    - "`cmake --build render-core/build --config Release --target ag99-render-host` passed with no errors and no compiler warnings."
    - "Live run against the local Adapter with `--text=` still reaches `[motion] compiled 5 parameter tracks for 800 ms` with no exception, confirming no regression in the text playback path."
  evidence_gap:
    - "The microphone path itself was never exercised: it can only be started from the tray menu, and the Adapter's control.start_mic is still reported as an ignored message type. Start, sustained capture, stop from the tray, and stop at shutdown all need a manual run."

native_motion_compile_crash_fix:
  recorded_at: "2026-10-02"
  class: bugfix
  risk: high
  status: source_complete_pending_live_acceptance
  root_cause: >-
    CompileMotionPlan built the relation-graph edges iterator from a ternary whose
    two branches belong to different nlohmann json objects. The following
    `edges == profile->end()` therefore compared iterators across containers, which
    nlohmann rejects with invalid_iterator.212. With no try/catch in wWinMain the
    exception escaped to std::terminate, abort, and __fastfail(FAST_FAIL_FATAL_APP_EXIT),
    which Windows reports as 0xc0000409 in ucrtbase.dll. Symptom: the host died
    silently whenever a motion intent arrived after playing a text reply.
  scope:
    - "Compare nlohmann iterators only within the object that produced them; split the relation_graph and edges lookups into two same-object guards."
    - "Convert a throwing CompileMotionPlan call into a logged rejection consistent with the existing invalid-plan path."
    - "Add a per-frame exception boundary in Run that logs the exception type and stops after 30 consecutive failures."
  non_actions:
    - "Do not change the Adapter, the frontend, or the motion plan schema."
    - "Do not change frame order, parameter resolution, or the single pre-Physics write."
  review: >-
    Confirmed D3D11CompositionSurface::BeginFrame is idempotent and both BeginFrame
    and Present are noexcept, so re-entering the frame after a mid-frame throw is
    safe. Verified the original expression throws and the rewritten form does not
    using a standalone program linked against the same nlohmann 3.11.3 headers.
  validation:
    - "`cmake --build render-core/build --config Release --target ag99-render-host` passed and relinked the executable."
    - "Live run against the local Adapter with `--text=`: log reached `[motion] compiled N parameter tracks for 800 ms` with no exception and no crash; process stayed alive."
    - "Verified the executable timestamp is newer than the source timestamp before trusting each run; an earlier stale link had produced a false negative."
  evidence_gap:
    - "Motion playback quality, lip-sync appearance, and physics feel still require a human visual acceptance run."

native_audio_download_and_websocket_guards:
  recorded_at: "2026-10-02"
  class: bugfix
  risk: medium
  status: source_complete_pending_live_acceptance
  scope:
    - "Reject any audio download whose HTTP status is not 200, and verify the body is a real PCM WAV before it can reach the decoder or PlaySound."
    - "Bypass the system proxy for the loopback audio cache, which previously returned a proxy error page that looked like a successful download."
    - "Cap the download size so a bad response cannot exhaust memory."
    - "Serialise WinHttpWebSocketClient::close handle teardown against send_text and send_binary."
  root_cause: >-
    DownloadHttp treated any non-empty response body as audio, so a 404 page or
    a proxy error page was written to a temp file and handed to PlaySound.
    Separately, close() released the WinHTTP handles without taking send_mutex,
    so a sender that had already passed connected() could call
    WinHttpWebSocketSend on a handle close() had already closed.
  non_actions:
    - "Do not change the cached audio URL, the WAV parsing, or the playback scheduling."
    - "Do not change the WebSocket frame format or the close handshake."
  validation:
    - "`cmake --build render-core/build --config Release --target ag99-render-host` passed with no errors or warnings."
    - "`cmake --build runtime-core/build --config Release --target ag99-runtime-protocol-smoke` passed and the smoke executable exited 0."
    - "Live run against the local Adapter downloaded and played a real cached WAV with no rejection, and the motion intent still compiled, confirming the new validation accepts the normal path."
  evidence_gap:
    - "The rejection branch was not exercised against a real failing response; it was verified by reading the Adapter's static server rather than by serving an error page."

