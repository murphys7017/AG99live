    Timestamp capture requests using local monotonic time. Capture/send waits,
    filtering, model and admission consume one lifetime; only remaining TTL is
    submitted. Core separately pins Sensor expiry before permission waits.
  validation: >-
    Final call-path review found no additional blockers.
    Renderer/WebSDK/Node typechecks and full Electron production build passed.
    Changed Python Ruff/compilation passed. Controlled public capture-boundary
    smoke reproduced hang recovery, paused automatic retries and late-result
