runtime:
  mode: unified_playback_timeline_phase3_motion_timeline_context
backlog:
  - id: motion_lab_history_sample_workbench
    status: todo
    summary: Build a standalone historical motion sample workbench separate from the current Action Lab sandbox.
    notes:
      - Query saved Motion Lab SQLite raw events instead of relying only on in-memory recent motionPlaybackRecords.
      - Default the UI to useful training candidates such as turn.assistant_output, with optional expansion of all events for the same turn_id.
      - Support filtering by event_type, turn_id, profile_id/profile_revision, and conversation context.
      - Reuse the existing preview_motion_payload playback path so selected or adjusted historical samples can be observed on Live2D.
      - Save curated and adjusted samples back into the existing motion tuning sample flow for later LLM reference or training export.
  - id: performance_curve_timing_layer
    status: mvp_implemented
    summary: Add an independent small-model performance curve layer for speech-synchronized motion timing.
    notes:
      - Performance curve generation requires an independently configured performance_curve_provider_id; empty, missing, or non-chat Provider bindings fail configuration and never reuse the current turn chat Provider.
      - Curve generation uses the AG99 frontend turn from external_correlation_id plus the phase's tts_request_id, and separately records AstrBot tts_turn_id plus logical message_id.
      - Result contribution registers pending input, while the read-only AstrBot TTS state hook starts generation only on generating; if not ready before motion egress, the task is cancelled and the original motion keeps its own valid timing.
      - Requested, resolved, failed, and attached curve events are stored in Motion Lab SQLite raw events.
      - Frontend protocol parsing rejects invalid hints; a valid optional hint that cannot use the matched clock is explicitly skipped while the base motion keeps its own timing.
      - A five-preset per-frame curve library is now selected by curve family; real-time generated custom curves remain intentionally out of scope.
  - id: unified_timeline_direct_sink_execution
    status: in_progress
    summary: Move remaining prepare/terminal and SessionStore coordination from migration-era segment-sink wiring toward PlaybackTimelineEngine-driven sink lifecycle.
    notes:
      - Audio and motion start are now registered as PlaybackTimelineEngine sink callbacks and invoked through startSink.
      - Browser audio release now enters PlaybackTimelineRuntime.startAudioTimelineSink before the actual audio segment sink starts.
      - Audio lifecycle and ordinary motion started/terminal SessionStore writes now have PlaybackTimelineRuntime lifecycle session ports; production motion history is outside PlaybackCompletionCoordinator, which now only observes turn settlement and sends playback_finished.
      - Keep SessionStore as the persistent turn/segment fact store, but move execution ownership into timeline sinks.
      - Reduce AdapterAudioRuntime to adapter/session state bridge plus protocol-facing convenience methods.
      - Make missing sink wiring a hard error; do not reintroduce compatibility fallback routes.
      - Start with audio and motion sink execution before text/subtitle and lip sync are fully independent.
  - id: lip_sync_live2d_websdk_boundary
    status: in_progress
    summary: Evaluate moving low-level lip-sync sampling and Live2D parameter writes into the Live2D WebSDK adapter/runtime boundary.
    notes:
      - PlaybackTimeline schedules and starts lip_sync as an optional sink; the audio segment adapter now only supplies the audio-element event and distinguishes disposal from interruption.
      - Live2D boundary now owns mouth-value sampling, WebAudio graph details, external lip-sync parameter writes, and cleanup.
      - The boundary must still report started/failed/completed/interrupted back to the timeline; silent success is not acceptable during migration.
      - Keep the shared HTMLAudioElement/audio clock ownership explicit to avoid desynchronizing mouth movement from sound.
