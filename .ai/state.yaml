task:
  class: feature
  risk: high
  phase: completion
  status: complete
  scope: "Move semantic sequence timing and speech-gesture composition into one ModelEngine parameter track graph compiler while preserving engine.parameter_plan.v3 and existing runtime ownership."

context:
  confidence: high
  assumptions:
    - Product phase one implementation is complete.
    - Manual observation, model tuning, and live runtime acceptance are not implementation backlog.
    - The first parameter track graph is a compile-time ModelEngine structure, not a second runtime graph engine or player.
    - The graph emits the existing engine.parameter_plan.v3 keyframes and modulation fields; no protocol migration is required.
    - ParameterMixer remains a per-frame contribution mixer and does not acquire semantic timing ownership.
    - Deeper dynamics and Physics work, Motion Lab editing, small-model training, VTS semantic export, remote-operator separation, cross-host deployment, and release packaging belong to phase two or later.
    - Obsolete documents, code, tests, protocol versions, and migration history are deleted rather than retained as compatibility guidance.

architecture:
  phase_boundary:
    source: docs/01-架构与结构/06-一期完成边界与二期入口.md
    phase_one: complete
    phase_two: planned
  product_flow:
    - AstrBot owns conversation, event queues, main-model calls, and TTS.
    - The Adapter projects Live2D capabilities, validates motion intent, binds identities, and emits one atomic output.segment.v3.
    - SessionStore owns settled protocol facts; PlaybackTimeline owns the segment clock and required sink lifecycle.
    - ModelEngine compiles engine.motion_intent.v4 into CompiledSemanticMotion and engine.parameter_plan.v3.
    - ParameterPresentation and ParameterMixer produce one active parameter frame before Cubism Physics.
    - Live2D WebSDK owns final parameter writes, lip sync, Physics, model update, and rendering.
  identity:
    turn_id: Conversation turn identity shared across AstrBot, Adapter, frontend, and Motion Lab.
    message_id: Logical assistant output segment identity.
    tts_request_id: One TTS generation lifecycle.
    run_id: One accepted motion execution owned by one segment.
  protocols:
    source: astrbot_plugin_ag99live_adapter/protocol/schema_manifest.json
    websocket_envelope: v2
    output_segment: output.segment.v3
    motion_intent: engine.motion_intent.v4
    parameter_plan: engine.parameter_plan.v3
    semantic_axis_profile: ag99.semantic_axis_profile.v3
    relation_graph: ag99.semantic_axis_relation_graph.v1
    voice_following_profile: ag99.voice_following_profile.v3
    model_info: live2d_scan.v3
  ownership_rules:
    - The main model is the only source of semantic motion direction and level.
    - Optional performance curves never block TTS, segment release, or base motion playback.
    - ParameterMixer combines resolved active contributions and does not interpret semantic levels or own Timeline state.
    - Cubism Physics output parameters are never directly driven by semantic motion or active-parameter smoothing.
    - Invalid identity, schema, timing, binding, or lifecycle state fails visibly instead of activating a fallback path.

verification:
  policy:
    - Use focused source inspection, the narrow renderer typecheck, the existing ModelEngine boundary smoke, documentation link checks, and git diff review for this task.
    - Automated tests are low-confidence boundary smoke checks and are not end-to-end evidence.
    - Live Electron, AstrBot, TTS, and Live2D observation is user-led acceptance, not unfinished implementation work.
  current_checks:
    - `npm run typecheck:renderer` passed.
    - A focused coordinated parameter-track input/output probe passed during implementation; its large fixture was deliberately not retained.
    - The existing minimal `npm run test:model-engine` boundary smoke passed after test cleanup.
    - Audio completion detaches the HTMLAudioElement clock into Timeline audio-tail continuation, so residual motion retains a monotonic segment clock after speech ends.
    - Source review confirms sequence graph ownership moved out of compileModelParameterPlan and speech modulation ownership moved out of ModelParameterBindingStage.
    - The semantic schedule retains its existing duration; short per-parameter windows compress locally, and only the terminal transition/residual/blend-out tail can extend the plan.
    - Changed documentation links resolve and stale unfinished-track-graph wording is absent.
    - git diff --check reports no whitespace errors.

backlog:
  phase_two:
    - Gaze, face, hesitation, and residual response policies beyond the completed head/body V3 dynamics.
    - Explicit sequence-step to phrase identity after real data proves the required protocol shape.
    - Cubism Physics setting diagnostics and model-level presentation profiles.
    - Motion Lab sequence editing, diversity summaries, and training-data workbench.
    - Small motion-model training and VTube Studio semantic labeling/export.
    - Remote-operator plugin separation, authenticated cross-host deployment, and release packaging.
