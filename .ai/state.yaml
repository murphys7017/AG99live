task:
  class: feature
  risk: medium
  phase: target_documented
  scope: Remote operator task delegation target state for AG99live adapter and external SDK
context:
  confidence: medium
  assumptions:
    - The remote operator should be an independent SDK/service, not part of the AG99live frontend.
    - AG99live Adapter can act as the hub with one WebSocket to the desktop frontend and one WebSocket to the SDK.
    - AstrBot should produce task-level commands with target, objective, success criteria, and constraints instead of low-level click/type commands.
    - The SDK can use OpenCode CLI or Codex CLI internally to split and execute tasks.
    - Prompt injection exposes remote operator availability and capability context; execution details remain inside the SDK.
  unresolved_questions:
    - Exact SDK transport authentication and pairing model still needs design.
    - Exact frontend client object schema for operator progress, approval, artifacts, and final results still needs design.
architecture:
  stability: evolving
  boundary_changes:
    - Planned remote operator events should stay separate from `engine.motion_*` and avoid replacing the existing motion pipeline.
    - Planned adapter work adds remote operator prompt/result integration and SDK connection management.
    - Planned SDK owns low-level execution through OpenCode/Codex/browser/shell/filesystem/desktop tools.
verification:
  checks_run:
    - docs target-state review only
  checks_failed: []
  validation_gap: No implementation or runtime validation yet; this turn only records the target state.
runtime:
  mode: planning
