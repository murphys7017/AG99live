### Model
model_name_or_path: XHToken/Spark-X2.6-1.7B-Base
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

### Dataset
dataset: spark_x26_weak
dataset_dir: data/neurobrain
template: spark
enable_thinking: false
cutoff_len: 2048
preprocessing_num_workers: 1
dataloader_num_workers: 0
max_samples: 234

### Output
output_dir: output/spark-x26-1p7b-lora-neurobrain
logging_steps: 10
save_steps: 1000
save_only_model: true
overwrite_output_dir: false
report_to: none

### Training
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0
bf16: true
gradient_checkpointing: true
